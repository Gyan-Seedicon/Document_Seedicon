<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seedicon — Government Grants Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="./css/global.css">
<link rel="stylesheet" href="./css/pages/government-grants.css">
<!-- Lucide Icons CDN -->
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="app-viewport">
  <div class="app-frame">
    <!-- Main Left Sidebar Slot -->
    <div id="sidebarSlot"></div>

    <main class="founder-workspace-canvas">
      <!-- Top Navigation Bar -->
      <header class="workspace-top-nav">
        <div class="workspace-top-nav-left">
          <div class="topnav-page-title">
            <span class="topnav-page-icon"><i data-lucide="landmark" style="width:15px; height:15px;"></i></span>
            <span class="topnav-page-name">Government grants</span>
          </div>
        </div>

        <div class="workspace-search-pill-wrap">
          <i data-lucide="search" class="workspace-search-icon"></i>
          <input type="text" id="globalGrantSearchInput" class="workspace-search-input" placeholder="Search schemes, ministries, grants..." oninput="handleGrantSearch(this.value)" />
          <span class="workspace-search-kbd">⌘K</span>
        </div>

        <div class="workspace-top-nav-right" id="topNavRightSlot">
          <button class="btn btn-outline" style="font-size:12px; padding:5px 11px; gap:5px;" onclick="window.showToast && window.showToast('Grant application assistant initialized', 'info')">
            <i data-lucide="sparkles" style="width:13px; height:13px;"></i>
            <span>Eligibility Matcher</span>
          </button>
        </div>
      </header>

      <!-- Scroll Body (Full-Width Linear Canvas) -->
      <div class="workspace-scroll-body" style="padding:0 !important;">
        <div id="governmentGrantsRoot" class="grants-page-root">
          <!-- Dynamic Content rendered via app.js -->
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Slide-Over Grant Detail Drawer Backdrop -->
<div class="vdr-drawer-backdrop" id="grantDetailDrawerBackdrop" onclick="handleGrantDrawerBackdropClick(event)">
  <div class="vdr-drawer-card grant-drawer-card" id="grantDetailDrawerCard">
    <div class="vdr-drawer-header">
      <div class="vdr-drawer-title-stack">
        <span class="vdr-drawer-title" id="grantDrawerHeaderTitle">Grant Overview</span>
        <span class="vdr-drawer-subtitle" id="grantDrawerHeaderSub">Government Scheme Details</span>
      </div>
      <div class="vdr-drawer-actions">
        <button class="vdr-drawer-icon-btn" onclick="copyCurrentGrantLink()" title="Copy link">
          <i data-lucide="link" style="width:15px; height:15px;"></i>
        </button>
        <button class="vdr-drawer-icon-btn" onclick="closeGrantDetailDrawer()" title="Close (Esc)">
          <i data-lucide="x" style="width:16px; height:16px;"></i>
        </button>
      </div>
    </div>

    <!-- Grant Drawer Body -->
    <div class="grant-drawer-body" id="grantDrawerBody"></div>
  </div>
</div>

<!-- Modal Slot -->
<div id="modalSlot"></div>

<script src="./js/components.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
