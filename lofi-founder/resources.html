<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seedicon — Founder Resources &amp; Playbooks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="./css/global.css">
<link rel="stylesheet" href="./css/pages/resources.css">
<!-- Lucide Icons CDN -->
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="app-viewport">
  <div class="app-frame">
    <!-- Main Left Sidebar Slot -->
    <div id="sidebarSlot"></div>

    <main class="founder-workspace-canvas">
      <!-- Top Navigation Bar -->
      <header class="workspace-top-nav">
        <div class="workspace-top-nav-left">
          <div class="topnav-page-title">
            <span class="topnav-page-icon"><i data-lucide="book-open" style="width:15px; height:15px;"></i></span>
            <span class="topnav-page-name">Resources &amp; Playbooks</span>
          </div>
        </div>
        
        <div class="workspace-search-pill-wrap">
          <i data-lucide="search" class="workspace-search-icon"></i>
          <input type="text" id="globalResourceSearchInput" class="workspace-search-input" placeholder="Search playbooks, templates, legal term sheets..." oninput="handleResourceSearch(this.value)" />
          <span class="workspace-search-kbd">⌘K</span>
        </div>

        <div class="workspace-top-nav-right" id="topNavRightSlot">
          <button class="btn btn-outline" style="font-size:12px; padding:5px 11px; gap:5px;" onclick="window.showToast && window.showToast('Downloaded complete Seedicon Founder Toolkit bundle (.zip)', 'success')">
            <i data-lucide="download-cloud" style="width:13px; height:13px;"></i>
            <span>Download All Kits</span>
          </button>
        </div>
      </header>

      <!-- Scroll Body (Full Width, No Max-Width Limitation) -->
      <div class="workspace-scroll-body" style="padding:0 !important;">
        <div id="resourcesRoot" class="resources-page-root">
          <!-- Dynamic Content rendered via app.js -->
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Slide-Over Resource & Blog Reader Drawer Backdrop -->
<div class="vdr-drawer-backdrop" id="resourceReaderDrawerBackdrop" onclick="handleResourceReaderBackdropClick(event)">
  <div class="vdr-drawer-card resource-reader-drawer-card" id="resourceReaderDrawerCard">
    <div class="vdr-drawer-header">
      <div class="vdr-drawer-title-stack">
        <span class="vdr-drawer-title" id="resourceReaderHeaderCategory">Founder Playbook</span>
        <span class="vdr-drawer-subtitle" id="resourceReaderHeaderMeta">Verified Diligence Resource</span>
      </div>
      <div class="vdr-drawer-actions">
        <button class="vdr-drawer-icon-btn" onclick="toggleCurrentResourceBookmark()" title="Bookmark playbook" id="resourceReaderBookmarkBtn">
          <i data-lucide="bookmark" style="width:15px; height:15px;"></i>
        </button>
        <button class="vdr-drawer-icon-btn" onclick="copyCurrentResourceLink()" title="Copy link">
          <i data-lucide="link" style="width:15px; height:15px;"></i>
        </button>
        <button class="vdr-drawer-icon-btn" onclick="closeResourceReaderDrawer()" title="Close (Esc)">
          <i data-lucide="x" style="width:16px; height:16px;"></i>
        </button>
      </div>
    </div>

    <!-- Reader Drawer Body -->
    <div class="resource-reader-body" id="resourceReaderDrawerBody"></div>
  </div>
</div>

<!-- Modal Slot -->
<div id="modalSlot"></div>

<script src="./js/components.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
