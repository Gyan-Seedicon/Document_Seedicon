<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seedicon — Investor Pipeline &amp; CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/global.css">
<link rel="stylesheet" href="./css/styles.css">
<link rel="stylesheet" href="./css/pages/investor-tracking.css">
<!-- Lucide Icons CDN -->
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<!-- Outer Ambient Viewport Frame -->
<div class="app-viewport">
  <!-- Inner Floating Application Card -->
  <div class="app-frame">

    <!-- 01. Integrated Modern Sidebar Slot (Rendered via components.js) -->
    <div id="sidebarSlot"></div>

    <!-- 02. Main Workspace Canvas -->
    <main class="founder-workspace-canvas">
      
      <!-- Top Navigation Header Bar -->
      <header class="workspace-top-nav">
        <!-- Left Area: Functional Breadcrumb Trail -->
        <div class="workspace-top-nav-left">
          <nav class="breadcrumb-nav" aria-label="Breadcrumb">
            <span class="topnav-page-icon"><i data-lucide="handshake" style="width:15px; height:15px;"></i></span>
            <a href="./investor-tracking.html" class="breadcrumb-link">Investor CRM</a>
            <i data-lucide="chevron-right" class="breadcrumb-sep"></i>
            <span class="breadcrumb-current" id="invPipelineBreadcrumb">Pipeline</span>
          </nav>
        </div>

        <!-- Center Pill Search Bar -->
        <div class="workspace-search-pill-wrap">
          <i data-lucide="search" class="workspace-search-icon"></i>
          <input type="text" class="workspace-search-input" placeholder="Search investors in this pipeline..." oninput="handleInvPipelineSearch(this)" />
          <span class="workspace-search-kbd">⌘K</span>
        </div>

        <!-- Right Header Action Group (Populated via components.js) -->
        <div class="workspace-top-nav-right"></div>

      </header>

      <!-- Scrollable Workspace Body -->
      <div class="workspace-scroll-body">

        <div class="it-page-root" id="investorPipelineRoot">
          <!-- Investor Pipeline board/list rendered dynamically via app.js -->
        </div>

      </div>

    </main>

  </div>
</div>

<!-- Modal & Toast Dynamic Slot -->
<div id="modalSlot"></div>

<!-- Scripts -->
<script src="./js/components.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
