<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seedicon — Venture Intelligence &amp; Startup News</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="./css/global.css">
<link rel="stylesheet" href="./css/pages/startup-news.css">
<!-- Lucide Icons CDN -->
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="app-viewport">
  <div class="app-frame">
    <!-- Main Left Sidebar Slot -->
    <div id="sidebarSlot"></div>

    <main class="founder-workspace-canvas">
      <!-- Top Navigation Bar -->
      <header class="workspace-top-nav">
        <div class="workspace-top-nav-left">
          <div class="topnav-page-title">
            <span class="topnav-page-icon"><i data-lucide="newspaper" style="width:15px; height:15px;"></i></span>
            <span class="topnav-page-name">Startup News</span>
          </div>
        </div>
        
        <div class="workspace-search-pill-wrap">
          <i data-lucide="search" class="workspace-search-icon"></i>
          <input type="text" id="globalNewsSearchInput" class="workspace-search-input" placeholder="Search news, funding rounds, insights..." oninput="handleNewsSearch(this.value)" />
          <span class="workspace-search-kbd">⌘K</span>
        </div>

        <div class="workspace-top-nav-right" id="topNavRightSlot">
          <button class="btn btn-outline" style="font-size:12px; padding:5px 11px; gap:5px;" onclick="openSubmitDealModal()">
            <i data-lucide="plus" style="width:13px; height:13px;"></i>
            <span>Submit Round</span>
          </button>
        </div>
      </header>

      <!-- Scroll Body (Full Width Canvas, Ignores Max-Width) -->
      <div class="workspace-scroll-body" style="padding:0 !important;">
        <div id="startupNewsRoot" class="news-page-root">
          <!-- Dynamic Content rendered via app.js -->
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Slide-Over Article Reader Drawer Backdrop -->
<div class="vdr-drawer-backdrop" id="newsReaderDrawerBackdrop" onclick="handleNewsReaderBackdropClick(event)">
  <div class="vdr-drawer-card news-reader-drawer-card" id="newsReaderDrawerCard">
    <div class="vdr-drawer-header">
      <div class="vdr-drawer-title-stack">
        <span class="vdr-drawer-title" id="newsReaderHeaderCategory">Venture Intelligence</span>
        <span class="vdr-drawer-subtitle" id="newsReaderHeaderMeta">Published today · 5 min read</span>
      </div>
      <div class="vdr-drawer-actions">
        <button class="vdr-drawer-icon-btn" onclick="toggleCurrentArticleBookmark()" title="Bookmark article" id="newsReaderBookmarkBtn">
          <i data-lucide="bookmark" style="width:15px; height:15px;"></i>
        </button>
        <button class="vdr-drawer-icon-btn" onclick="copyCurrentArticleLink()" title="Copy link">
          <i data-lucide="link" style="width:15px; height:15px;"></i>
        </button>
        <button class="vdr-drawer-icon-btn" onclick="closeNewsReaderDrawer()" title="Close (Esc)">
          <i data-lucide="x" style="width:16px; height:16px;"></i>
        </button>
      </div>
    </div>

    <!-- Article Reader Body -->
    <div class="news-reader-body" id="newsReaderDrawerBody"></div>
  </div>
</div>

<!-- Modal Slot -->
<div id="modalSlot"></div>

<script src="./js/components.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
