<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seedicon — Startup News</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="./css/global.css">
<!-- Lucide Icons CDN -->
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="app-viewport">
  <div class="app-frame">
    <div id="sidebarSlot"></div>

    <main class="founder-workspace-canvas">
      <header class="workspace-top-nav">
        <div class="workspace-top-nav-left">
          <div class="topnav-page-title">
            <span class="topnav-page-icon"><i data-lucide="newspaper" style="width:15px; height:15px;"></i></span>
            <span class="topnav-page-name">Startup News</span>
          </div>
        </div>
        <div class="workspace-search-pill-wrap">
          <i data-lucide="search" class="workspace-search-icon"></i>
          <input type="text" class="workspace-search-input" placeholder="Search startup news..." />
          <span class="workspace-search-kbd">⌘K</span>
        </div>
        <div class="workspace-top-nav-right" id="topNavRightSlot"></div>
      </header>

      <div class="workspace-scroll-body">
        <div class="center-focused-container" style="padding-top:20px;">
          <div class="directory-hero-row">
            <div class="directory-hero-titles">
              <h1 class="directory-main-title">
                <span>Startup News</span>
                <span class="badge-pill neutral-soft">Workspace</span>
              </h1>
              <p class="directory-main-subtitle">
                Daily curated venture intelligence, funding rounds, and macroeconomic insights for founders.
              </p>
            </div>
          </div>

          <div class="empty-state-box" style="padding:60px 24px; text-align:center; background:#FFFFFF; border:1px solid var(--border-main); border-radius:10px; margin-top:16px;">
            <div style="width:44px; height:44px; border-radius:50%; background:var(--bg-muted); display:inline-flex; align-items:center; justify-content:center; margin-bottom:12px;">
              <i data-lucide="newspaper" style="width:20px; height:20px; color:var(--text-dark);"></i>
            </div>
            <h4 style="font-size:15px; font-weight:800; color:var(--text-dark); margin:0 0 6px;">Venture News Feed</h4>
            <p style="font-size:12.5px; color:var(--text-muted); max-width:440px; margin:0 auto 16px; line-height:1.5;">Curated updates, investor syndicate trends, and policy changes affecting early-stage founders.</p>
            <a href="./index.html" class="btn btn-outline" style="font-size:12px; padding:6px 14px; text-decoration:none;">← Return to Dashboard</a>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="modalSlot"></div>

<script src="./js/components.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
