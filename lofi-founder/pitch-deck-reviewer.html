<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seedicon — Pitch Deck Reviewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="./css/styles.css">
<!-- Lucide Icons CDN -->
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<!-- Outer Ambient Viewport Frame -->
<div class="app-viewport">
  <!-- Inner Floating Application Card -->
  <div class="app-frame">

    <!-- 01. Integrated Modern Sidebar Slot (Rendered via components.js) -->
    <div id="sidebarSlot"></div>

    <!-- 02. Main Workspace Canvas (Center-Focused Pitch Deck Reviewer) -->
    <main class="founder-workspace-canvas">
      
      <!-- Top Navigation Header Bar -->
      <header class="workspace-top-nav">
        <!-- Left Area: Page Icon + Name -->
        <div class="workspace-top-nav-left">
          <div class="topnav-page-title">
            <span class="topnav-page-icon"><i data-lucide="presentation" style="width:15px; height:15px;"></i></span>
            <span class="topnav-page-name">Pitch deck reviewer</span>
          </div>
        </div>

        <!-- Center Pill Search Bar -->
        <div class="workspace-search-pill-wrap">
          <i data-lucide="search" class="workspace-search-icon"></i>
          <input type="text" class="workspace-search-input" placeholder="Search reports, decks, or past reviews..." oninput="handlePDRSearch(this)" />
          <span class="workspace-search-kbd">⌘K</span>
        </div>

        <!-- Right Header Action Group -->
        <div class="workspace-top-nav-right">
          <button class="nav-ghost-icon-btn" title="Messages" onclick="openMessagesNavDrawer()">
            <i data-lucide="message-square" style="width:16px; height:16px;"></i>
          </button>

          <button class="nav-ghost-icon-btn" title="Notifications" onclick="showNotifications()">
            <i data-lucide="bell" style="width:16px; height:16px;"></i>
          </button>

          <button class="nav-ghost-icon-btn" title="Documentation &amp; Notes" onclick="showHelp()">
            <i data-lucide="file-text" style="width:16px; height:16px;"></i>
          </button>

          <button class="nav-invite-btn" title="Invite Team Members" onclick="openInviteModal()">
            <i data-lucide="user-plus" style="width:14px; height:14px;"></i>
            <span>Invite</span>
          </button>

          <div class="avatar-gradient-circle" title="Dr. Sarah Chen (Founder)">SC</div>
        </div>
      </header>

      <!-- Scrollable Workspace Body -->
      <div class="workspace-scroll-body">
        
        <div class="center-focused-container pdr-page-root" id="pitchDeckRoot">
          <!-- Pitch Deck Reviewer rendered dynamically via app.js -->
        </div>

      </div>

    </main>

  </div>
</div>

<!-- Modal & Toast Dynamic Slot -->
<div id="modalSlot"></div>

<!-- Scripts -->
<script src="./js/components.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
