<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VDR Data Room Detail — Seedicon Investor Platform</title>
  <link rel="stylesheet" href="./css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* ── Split Workspace Layout ── */
    .vdr-workspace-wrap {
      display: flex;
      flex: 1;
      height: calc(100vh - 46px);
      overflow: hidden;
      background: #FFFFFF;
    }

    /* Left Folder Sidebar */
    .vdr-folder-sidebar {
      width: 240px;
      min-width: 240px;
      background: #FAFAFA;
      border-right: 1px solid #E4E4E2;
      display: flex;
      flex-direction: column;
      height: 100%;
      user-select: none;
    }

    .vdr-folder-sidebar-header {
      padding: 14px 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #EBEBEA;
      background: #FAFAFA;
    }

    .vdr-sidebar-room-name {
      font-size: 13.5px;
      font-weight: 800;
      color: #1A1A18;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
    }

    .vdr-sidebar-add-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      color: #7A7A78;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s ease;
    }

    .vdr-sidebar-add-btn:hover {
      background: #EBEBEA;
      color: #1A1A18;
    }

    .vdr-folder-nav-list {
      padding: 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      overflow-y: auto;
    }

    .vdr-nav-section-label {
      font-size: 9.5px;
      font-weight: 800;
      color: #8C8C88;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 10px 10px 4px;
    }

    .vdr-nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #4A4A48;
      cursor: pointer;
      transition: all 0.1s ease;
      position: relative;
    }

    .vdr-nav-item:hover {
      background: #EFEFED;
      color: #1A1A18;
    }

    .vdr-nav-item.active {
      background: #EAEAE8;
      color: #1A1A18;
      font-weight: 700;
    }

    .vdr-nav-item-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .vdr-nav-item-icon {
      color: #7A7A78;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .vdr-nav-item.active .vdr-nav-item-icon {
      color: #1A1A18;
    }

    .vdr-nav-item-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .vdr-nav-badge {
      font-size: 10px;
      font-weight: 700;
      color: #7A7A78;
      background: #E2E2E0;
      padding: 1px 6px;
      border-radius: 10px;
    }

    .vdr-nav-item.active .vdr-nav-badge {
      background: #1A1A18;
      color: #FFFFFF;
    }

    .vdr-nav-item-actions {
      display: none;
      align-items: center;
      gap: 2px;
    }

    .vdr-nav-item:hover .vdr-nav-item-actions {
      display: flex;
    }

    .vdr-nav-dot-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      color: #8A8A88;
      padding: 2px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vdr-nav-dot-btn:hover {
      color: #1A1A18;
      background: rgba(0, 0, 0, 0.08);
    }

    .vdr-add-folder-row-btn {
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px dashed #D0D0CE;
      background: transparent;
      color: #6A6A68;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.1s ease;
      font-family: inherit;
      width: 100%;
      text-align: left;
    }

    .vdr-add-folder-row-btn:hover {
      background: #EFEFED;
      color: #1A1A18;
      border-color: #1A1A18;
    }

    /* Sidebar Footer Usage Indicator */
    .vdr-folder-sidebar-footer {
      padding: 10px 14px;
      border-top: 1px solid #EBEBEA;
      background: #FAFAFA;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .vdr-usage-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1A1A18;
      color: #FFFFFF;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 10.5px;
      font-weight: 700;
    }

    .vdr-usage-circle {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #FFFFFF;
    }

    .vdr-upgrade-link {
      font-size: 11px;
      font-weight: 700;
      color: #2563EB;
      text-decoration: none;
      cursor: pointer;
    }

    .vdr-upgrade-link:hover {
      text-decoration: underline;
    }

    /* ── Right Content Area ── */
    .vdr-main-workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow-y: auto;
      background: #FFFFFF;
    }

    /* Top Folder Action Header */
    .vdr-folder-topbar {
      padding: 12px 20px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #EBEBEA;
      background: #FFFFFF;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .vdr-folder-heading {
      font-size: 17px;
      font-weight: 800;
      color: #1A1A18;
      letter-spacing: -0.02em;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .vdr-topbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .vdr-btn-icon {
      background: #FFFFFF;
      border: 1px solid #DCDCDA;
      border-radius: 6px;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4A4A48;
      cursor: pointer;
      transition: all 0.1s;
    }

    .vdr-btn-icon:hover {
      background: #F0F0EE;
      color: #1A1A18;
    }

    .vdr-btn-outline {
      background: #FFFFFF;
      border: 1px solid #DCDCDA;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 11.5px;
      font-weight: 600;
      color: #3A3A38;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: inherit;
      transition: all 0.1s;
    }

    .vdr-btn-outline:hover {
      background: #F0F0EE;
      color: #1A1A18;
      border-color: #B0B0AE;
    }

    .vdr-btn-primary {
      background: #1A1A18;
      border: 1px solid #1A1A18;
      border-radius: 6px;
      padding: 6px 13px;
      font-size: 11.5px;
      font-weight: 700;
      color: #FFFFFF;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: inherit;
      transition: all 0.1s;
      position: relative;
    }

    .vdr-btn-primary:hover {
      background: #2A2A28;
    }

    /* Add New Dropdown Menu */
    .vdr-dropdown-wrap {
      position: relative;
      display: inline-block;
    }

    .vdr-dropdown-menu {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      background: #FFFFFF;
      border: 1px solid #DFDEDE;
      border-radius: 7px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
      min-width: 155px;
      z-index: 150;
      padding: 4px;
      display: none;
      flex-direction: column;
      gap: 2px;
    }

    .vdr-dropdown-menu.show {
      display: flex;
    }

    /* ── Condensed Files & Shared Table (Zero outer padding) ── */
    .vdr-files-table-container {
      padding: 0;
      flex: 1;
      width: 100%;
    }

    .vdr-table {
      width: 100%;
      border-collapse: collapse;
    }

    .vdr-table th {
      text-align: left;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #8C8C88;
      padding: 9px 20px;
      border-bottom: 1px solid #EBEBEA;
      background: #FAFAFA;
    }

    .vdr-table td {
      padding: 10px 20px;
      font-size: 12px;
      color: #3A3A38;
      border-bottom: 1px solid #F3F3F1;
      vertical-align: middle;
    }

    .vdr-table tr:hover td {
      background: #FAFAFA;
    }

    .vdr-file-name-cell {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: #1A1A18;
    }

    .vdr-file-icon {
      color: #6A6A68;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Template View Chip */
    .vdr-template-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #F4F4F2;
      border: 1px solid #DFDEDE;
      padding: 2.5px 8px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
      color: #1A1A18;
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .vdr-view-template-btn {
      background: transparent;
      border: none;
      color: #2563EB;
      font-size: 10.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 1px 4px;
      border-radius: 3px;
      transition: background 0.1s;
    }

    .vdr-view-template-btn:hover {
      background: #EFF6FF;
      text-decoration: underline;
    }

    /* Three dots Context Menu */
    .vdr-row-menu-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .vdr-context-menu {
      position: absolute;
      top: 100%;
      right: 0;
      background: #FFFFFF;
      border: 1px solid #DFDEDE;
      border-radius: 7px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      min-width: 140px;
      z-index: 100;
      padding: 3px;
      display: none;
      flex-direction: column;
      gap: 1px;
    }

    .vdr-context-menu.show {
      display: flex;
    }

    .vdr-menu-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 9px;
      font-size: 11.5px;
      font-weight: 600;
      color: #1A1A18;
      background: transparent;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
      width: 100%;
      font-family: inherit;
      transition: background 0.08s;
    }

    .vdr-menu-item:hover {
      background: #F0F0EE;
    }

    .vdr-menu-item.danger {
      color: #DC2626;
    }

    .vdr-menu-item.danger:hover {
      background: #FEF2F2;
    }

    /* Empty Folder State */
    .vdr-empty-folder {
      padding: 48px 20px;
      text-align: center;
      background: #FAFAFA;
      border: 1px dashed #DCDCDA;
      border-radius: 8px;
      margin: 20px;
    }

    /* ── Cover Letter View ── */
    .vdr-cover-letter-wrap {
      padding: 16px 20px 24px;
      max-width: 760px;
    }

    .vdr-cover-card {
      background: #FAFAFA;
      border: 1px solid #E0E0DE;
      border-radius: 8px;
      padding: 20px;
    }

    .vdr-cover-title-input {
      font-size: 15px;
      font-weight: 800;
      color: #1A1A18;
      border: 1px solid #DCDCDA;
      border-radius: 6px;
      padding: 8px 12px;
      width: 100%;
      background: #FFFFFF;
      margin-bottom: 12px;
      font-family: inherit;
      outline: none;
    }

    .vdr-cover-title-input:focus {
      border-color: #1A1A18;
    }

    .vdr-cover-textarea {
      font-size: 12px;
      line-height: 1.6;
      color: #2A2A28;
      border: 1px solid #DCDCDA;
      border-radius: 6px;
      padding: 12px;
      width: 100%;
      height: 240px;
      background: #FFFFFF;
      font-family: inherit;
      outline: none;
      resize: vertical;
    }

    .vdr-cover-textarea:focus {
      border-color: #1A1A18;
    }

    /* ── Shared Startups Status & Progress ── */
    .vdr-progress-bar-bg {
      width: 80px;
      height: 5px;
      background: #EBEBEA;
      border-radius: 3px;
      overflow: hidden;
      display: inline-block;
      vertical-align: middle;
      margin-right: 6px;
    }

    .vdr-progress-bar-fill {
      height: 100%;
      background: #1A1A18;
      border-radius: 3px;
    }

    .vdr-status-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-transform: capitalize;
    }

    .vdr-status-pill.completed { background: #ECFDF5; color: #047857; border: 1px solid #A7F3D0; }
    .vdr-status-pill.review { background: #EFF6FF; color: #1D4ED8; border: 1px solid #BFDBFE; }
    .vdr-status-pill.progress { background: #FFFBEB; color: #B45309; border: 1px solid #FDE68A; }
    .vdr-status-pill.invited { background: #F4F4F5; color: #52525B; border: 1px solid #E4E4E7; }

    /* Top Breadcrumb */
    .vdr-breadcrumb-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 20px;
      background: #FFFFFF;
      border-bottom: 1px solid #E4E4E2;
      flex-shrink: 0;
    }

    .vdr-breadcrumbs {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: #8A8A88;
    }

    .vdr-breadcrumbs a {
      color: #5A5A58;
      text-decoration: none;
      font-weight: 600;
    }

    .vdr-breadcrumbs a:hover {
      color: #1A1A18;
    }

    .vdr-breadcrumbs .curr {
      color: #1A1A18;
      font-weight: 700;
    }

    /* Local Modal Box */
    .vdr-modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.35);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeInBd 0.12s ease;
    }
    @keyframes fadeInBd { from { opacity:0; } to { opacity:1; } }
    .vdr-modal-box {
      background: #FFFFFF;
      border-radius: 8px;
      border: 1px solid #E0E0DE;
      width: 440px;
      max-width: 94vw;
      padding: 0;
      box-shadow: 0 16px 40px rgba(0,0,0,0.14);
    }
    .vdr-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #EBEBEA;
      padding: 12px 16px;
    }
    .vdr-modal-title { font-size: 13.5px; font-weight: 800; color: #1A1A18; }
    .vdr-modal-close {
      background: transparent; border: none; cursor: pointer; color: #7A7A78;
      display: flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; border-radius: 4px; font-size: 16px;
    }
    .vdr-modal-close:hover { background: #F0F0EE; color: #1A1A18; }
    .vdr-modal-body { padding: 16px; }
    .vdr-modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid #EBEBEA;
      margin-top: 14px;
    }
    .field-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .field-label { font-size: 11px; font-weight: 700; color: #3A3A38; }
    .field-input {
      border: 1px solid #DCDCDA; border-radius: 6px; padding: 7px 10px;
      font-size: 12px; font-family: Inter, sans-serif; color: #1A1A18;
      background: #FFFFFF; outline: none; width: 100%; box-sizing: border-box;
    }
    .field-input:focus { border-color: #1A1A18; }
  </style>
</head>
<body>
<div class="app-container">
  <div id="appHeaderSlot"></div>
  <div class="main-workspace" style="display:flex; flex-direction:row;">
    <div id="tinySidebarSlot"></div>
    <div id="mainSidebarSlot"></div>

    <main class="content-scrollable" style="padding:0; display:flex; flex-direction:column; background:#FFFFFF;">

      <!-- ── TOP BREADCRUMB NAVIGATION BAR ── -->
      <div class="vdr-breadcrumb-bar">
        <div class="vdr-breadcrumbs">
          <a href="./vdr.html">VDR (Data Room)</a>
          <i data-lucide="chevron-right" style="width:12px; height:12px; color:#A8A8A4;"></i>
          <span class="curr" id="breadcrumbRoomName">Seed</span>
        </div>

        <div style="display:flex; align-items:center; gap:8px;">
          <button class="vdr-btn-primary" onclick="openShareVdrDrawer()" style="font-size:11.5px; padding:5px 12px; gap:6px;">
            <i data-lucide="send" style="width:12px; height:12px;"></i>
            <span>Share Room</span>
          </button>
        </div>
      </div>

      <!-- ── SPLIT WORKSPACE: SIDEBAR + MAIN CONTENT ── -->
      <div class="vdr-workspace-wrap">
        
        <!-- Left Folder Sidebar -->
        <aside class="vdr-folder-sidebar">
          <div class="vdr-folder-sidebar-header">
            <span class="vdr-sidebar-room-name" id="sidebarRoomTitle">Seed</span>
            <button class="vdr-sidebar-add-btn" onclick="openAddFolderModal()" title="Create new folder">
              <i data-lucide="plus" style="width:14px; height:14px;"></i>
            </button>
          </div>

          <div class="vdr-folder-nav-list" id="vdrSidebarNav">
            <!-- Rendered dynamically -->
          </div>

          <!-- Footer Usage Indicator -->
          <div class="vdr-folder-sidebar-footer">
            <div class="vdr-usage-pill">
              <span class="vdr-usage-circle"></span>
              <span id="fileUsageCount">9/25 File used</span>
            </div>
            <a class="vdr-upgrade-link" onclick="if(window.showToast) window.showToast('Upgrade to unlimited files plan','info')">Upgrade</a>
          </div>
        </aside>

        <!-- Right Main Workspace Content Area -->
        <section class="vdr-main-workspace">
          
          <!-- Top Folder Action Header -->
          <div class="vdr-folder-topbar">
            <h2 class="vdr-folder-heading" id="activeSectionTitle">
              <span id="activeSectionName">General</span>
            </h2>

            <div class="vdr-topbar-actions" id="folderTopActions">
              <!-- Rendered via JS -->
            </div>
          </div>

          <!-- Dynamic Folder / Document / Shared Table Content Area -->
          <div id="vdrMainContent" class="vdr-files-table-container">
            <!-- Rendered via JS -->
          </div>

        </section>

      </div>

    </main>
  </div>
</div>

<!-- Local Modal -->
<div id="vdrModalBackdrop" style="display:none;" class="vdr-modal-backdrop" onclick="handleVDRBackdropClick(event)">
  <div class="vdr-modal-box" onclick="event.stopPropagation()">
    <div class="vdr-modal-header">
      <span class="vdr-modal-title" id="vdrModalTitle">Modal</span>
      <button class="vdr-modal-close" onclick="hideVDRModal()" title="Close">&#x2715;</button>
    </div>
    <div class="vdr-modal-body" id="vdrModalBody"></div>
  </div>
</div>

<div id="modalSlot"></div>

<script src="./js/components.js"></script>
<script src="./js/app.js"></script>

  let roomData = null;

  document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id') || 'vdr1';
    const customName = params.get('name');

    // Check localStorage first
    let saved = null;
    try {
      saved = JSON.parse(localStorage.getItem('vdr_' + id));
    } catch(e) {}

    if (saved) {
      roomData = saved;
    } else if (SEED_VDR_DATA[id]) {
      roomData = JSON.parse(JSON.stringify(SEED_VDR_DATA[id]));
    } else {
      roomData = {
        id,
        name: customName ? decodeURIComponent(customName) : 'New Data Room',
        folders: [
          { id: 'general', title: 'General', docs: [] }
        ],
        coverLetter: "Welcome to our Virtual Data Room.\n\nPlease upload all requested documents according to the checklist.",
        sharedStartups: []
      };
    }

    renderAll();
  });

  // Global click to close dropdowns and context menus
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.vdr-dropdown-wrap')) {
      document.getElementById('addNewDropdownMenu')?.classList.remove('show');
    }
    if (!e.target.closest('.vdr-row-menu-wrap')) {
      closeAllContextMenus();
    }
  });

  function closeAllContextMenus() {
    document.querySelectorAll('.vdr-context-menu.show').forEach(m => m.classList.remove('show'));
    document.getElementById('addNewDropdownMenu')?.classList.remove('show');
  }

  function toggleAddNewMenu(e) {
    e.stopPropagation();
    closeAllContextMenus();
    document.getElementById('addNewDropdownMenu')?.classList.toggle('show');
  }

  function persistRoomData() {
    try {
      localStorage.setItem('vdr_' + roomData.id, JSON.stringify(roomData));
    } catch(e) {}
  }

  function renderAll() {
    document.getElementById('breadcrumbRoomName').textContent = roomData.name;
    document.getElementById('sidebarRoomTitle').textContent = roomData.name;

    renderSidebar();
    renderActiveContent();
    updateFileUsage();
    if (typeof lucide !== 'undefined') lucide.createIcons();
  }

  function updateFileUsage() {
    let count = 0;
    (roomData.folders || []).forEach(f => {
      count += (f.docs || []).length;
    });
    const badge = document.getElementById('fileUsageCount');
    if (badge) badge.textContent = `${count}/25 File used`;
  }

    `);
  }

  /* ── COVER LETTER ACTIONS ── */
  function saveCoverLetter() {
    const text = document.getElementById('coverBodyInput')?.value || '';
    roomData.coverLetter = text;
    persistRoomData();
    if (window.showToast) window.showToast('Cover letter saved successfully!', 'check-circle');
  }

  function previewCoverLetter() {
    const title = document.getElementById('coverTitleInput')?.value || 'Cover Letter';
    const text = document.getElementById('coverBodyInput')?.value || '';
    showVDRModal('Cover Letter Preview', `
      <div style="padding:4px 0 10px;">
        <h3 style="font-size:14px; font-weight:800; color:#1A1A18; margin-bottom:10px;">${title}</h3>
        <div style="font-size:12px; line-height:1.6; color:#3A3A38; white-space:pre-wrap; background:#FAFAFA; padding:14px; border:1px solid #E0E0DE; border-radius:6px;">${text || 'No cover letter text added.'}</div>
        <div class="vdr-modal-footer">
          <button class="vdr-btn-primary" onclick="hideVDRModal()">Close Preview</button>
        </div>
      </div>
    `);
  }

  /* ── ADD FILE MODAL (WITH TEMPLATE ATTACHMENT) ── */
  function openAddFileModal() {
    if (activeNav === 'cover-letter' || activeNav === 'shared-startups') activeNav = 'general';
    const folder = (roomData.folders || []).find(f => f.id === activeNav) || roomData.folders[0];

    showVDRModal(`Add File to "${folder ? folder.title : 'Folder'}"`, `
      <div class="field-group">
        <label class="field-label">File Name <span style="color:#DC2626;">*</span></label>
        <input type="text" id="newDocNameInput" class="field-input" placeholder="e.g. Cap_Table_Summary_2026" />
      </div>

      <div class="field-group">
        <label class="field-label">File Type</label>
        <select id="newDocTypeSelect" class="field-input">
          <option value=".pdf">.pdf (PDF Document)</option>
          <option value=".xlsx">.xlsx (Spreadsheet Model)</option>
          <option value=".docx">.docx (Word Document)</option>
          <option value=".html">.html (Interactive Page)</option>
          <option value=".csv">.csv (Data File)</option>
        </select>
      </div>

      <div class="field-group">
        <label class="field-label">File Size</label>
        <input type="text" id="newDocSizeInput" class="field-input" value="248.10 KB" />
      </div>

      <div class="field-group" style="margin-top:10px;">
        <label class="field-label">Attach Reference Template (Optional)</label>
        <select id="newDocTemplateSelect" class="field-input" onchange="toggleCustomTemplateField(this)">
          <option value="">None (Standard Requirement)</option>
          <option value="CapTable_Model_v3.xlsx">CapTable_Model_v3.xlsx</option>
          <option value="Incorporation_Standard.pdf">Incorporation_Standard.pdf</option>
          <option value="SaaS_Financial_Model_Template.xlsx">SaaS_Financial_Model_Template.xlsx</option>
          <option value="SHA_Framework.docx">SHA_Framework.docx</option>
          <option value="IP_Assignment_Form.pdf">IP_Assignment_Form.pdf</option>
          <option value="__custom__">+ Enter Custom Template Name...</option>
        </select>
        <input type="text" id="customTemplateNameInput" class="field-input" placeholder="Custom_Template_Name.pdf" style="display:none; margin-top:6px;" />
      </div>

      <div class="vdr-modal-footer">
        <button class="vdr-btn-outline" onclick="hideVDRModal()">Cancel</button>
        <button class="vdr-btn-primary" onclick="confirmAddFile()">Add File</button>
      </div>
    `);
    setTimeout(() => document.getElementById('newDocNameInput')?.focus(), 80);
  }

  function toggleCustomTemplateField(sel) {
    const custom = document.getElementById('customTemplateNameInput');
    if (custom) {
      custom.style.display = sel.value === '__custom__' ? 'block' : 'none';
      if (sel.value === '__custom__') custom.focus();
    }
  }

  function confirmAddFile() {
    const name = document.getElementById('newDocNameInput')?.value?.trim();
    if (!name) {
      if (window.showToast) window.showToast('Please enter a file name', 'alert-circle');
      return;
    }
    const type = document.getElementById('newDocTypeSelect')?.value || '.pdf';
    const size = document.getElementById('newDocSizeInput')?.value?.trim() || '248.10 KB';
    
    let template = document.getElementById('newDocTemplateSelect')?.value || null;
    if (template === '__custom__') {
      template = document.getElementById('customTemplateNameInput')?.value?.trim() || null;
    }

    const folder = (roomData.folders || []).find(f => f.id === activeNav) || roomData.folders[0];
    if (folder) {
      if (!folder.docs) folder.docs = [];
      folder.docs.push({
        id: 'doc_' + Date.now(),
        name,
        template: template || null,
        size,
        type,
        date: new Date().toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' })
      });
      persistRoomData();
      hideVDRModal();
      renderAll();
      if (window.showToast) window.showToast(`File "${name}" added to ${folder.title}`);
    }
  }

  /* ── ADD FOLDER MODAL ── */
  function openAddFolderModal() {
    showVDRModal('New Folder', `
      <div class="field-group">
        <label class="field-label">Folder Name <span style="color:#DC2626;">*</span></label>
        <input type="text" id="newFolderTitleInput" class="field-input" placeholder="e.g. 05. Compliance & Regulatory" />
      </div>
      <div class="vdr-modal-footer">
        <button class="vdr-btn-outline" onclick="hideVDRModal()">Cancel</button>
        <button class="vdr-btn-primary" onclick="confirmCreateFolder()">Create Folder</button>
      </div>
    `);
    setTimeout(() => document.getElementById('newFolderTitleInput')?.focus(), 80);
  }

  function confirmCreateFolder() {
    const title = document.getElementById('newFolderTitleInput')?.value?.trim();
    if (!title) {
      if (window.showToast) window.showToast('Please enter a folder name', 'alert-circle');
      return;
    }
    const folderId = 'f_' + Date.now();
    roomData.folders.push({
      id: folderId,
      title,
      docs: []
    });
    activeNav = folderId;
    persistRoomData();
    hideVDRModal();
    renderAll();
    if (window.showToast) window.showToast(`Folder "${title}" created`);
  }

  /* ── RENAME / DELETE FOLDER ── */
  function openRenameFolderModal() {
    closeAllContextMenus();
    const folder = (roomData.folders || []).find(f => f.id === activeNav);
    if (!folder) return;

    showVDRModal('Rename Folder', `
      <div class="field-group">
        <label class="field-label">Folder Name</label>
        <input type="text" id="renameFolderInput" class="field-input" value="${folder.title}" />
      </div>
      <div class="vdr-modal-footer">
        <button class="vdr-btn-outline" onclick="hideVDRModal()">Cancel</button>
        <button class="vdr-btn-primary" onclick="confirmRenameFolder()">Save</button>
      </div>
    `);
  }

  function confirmRenameFolder() {
    const newTitle = document.getElementById('renameFolderInput')?.value?.trim();
    if (!newTitle) return;
    const folder = (roomData.folders || []).find(f => f.id === activeNav);
    if (folder) {
      folder.title = newTitle;
      persistRoomData();
      hideVDRModal();
      renderAll();
    }
  }

  function clearActiveFolder() {
    closeAllContextMenus();
    const folder = (roomData.folders || []).find(f => f.id === activeNav);
    if (folder) {
      folder.docs = [];
      persistRoomData();
      renderAll();
      if (window.showToast) window.showToast(`Files cleared from "${folder.title}"`);
    }
  }

  function deleteActiveFolder() {
    closeAllContextMenus();
    if (activeNav === 'general') {
      if (window.showToast) window.showToast('The General folder cannot be deleted', 'info');
      return;
    }
    roomData.folders = roomData.folders.filter(f => f.id !== activeNav);
    activeNav = 'general';
    persistRoomData();
    renderAll();
    if (window.showToast) window.showToast('Folder deleted');
  }

  /* ── DOCUMENT ACTIONS ── */
  function toggleDocMenu(docId, e) {
    e.stopPropagation();
    const menu = document.getElementById(`docMenu-${docId}`);
    const isShowing = menu && menu.classList.contains('show');
    closeAllContextMenus();
    if (menu && !isShowing) {
      menu.classList.add('show');
    }
  }

  function toggleStartupMenu(startupId, e) {
    e.stopPropagation();
    const menu = document.getElementById(`startupMenu-${startupId}`);
    const isShowing = menu && menu.classList.contains('show');
    closeAllContextMenus();
    if (menu && !isShowing) {
      menu.classList.add('show');
    }
  }

  function toggleFolderOptionsMenu(e) {
    e.stopPropagation();
    const menu = document.getElementById('folderOptionsMenu');
    const isShowing = menu && menu.classList.contains('show');
    closeAllContextMenus();
    if (menu && !isShowing) {
      menu.classList.add('show');
    }
  }

  function downloadFile(name) {
    closeAllContextMenus();
    if (window.showToast) window.showToast(`Downloading "${name}"...`, 'info');
  }

  function deleteDoc(docId) {
    closeAllContextMenus();
    const folder = (roomData.folders || []).find(f => f.id === activeNav);
    if (folder && folder.docs) {
      folder.docs = folder.docs.filter(d => d.id !== docId);
      persistRoomData();
      renderAll();
      if (window.showToast) window.showToast('File removed from folder');
    }
  }

  function openRenameDocModal(docId) {
    closeAllContextMenus();
    const folder = (roomData.folders || []).find(f => f.id === activeNav);
    const doc = folder ? (folder.docs || []).find(d => d.id === docId) : null;
    if (!doc) return;

    showVDRModal('Rename File', `
      <div class="field-group">
        <label class="field-label">File Name</label>
        <input type="text" id="renameDocInput" class="field-input" value="${doc.name}" />
      </div>
      <div class="vdr-modal-footer">
        <button class="vdr-btn-outline" onclick="hideVDRModal()">Cancel</button>
        <button class="vdr-btn-primary" onclick="confirmRenameDoc('${docId}')">Save</button>
      </div>
    `);
  }

  function confirmRenameDoc(docId) {
    const newName = document.getElementById('renameDocInput')?.value?.trim();
    if (!newName) return;
    const folder = (roomData.folders || []).find(f => f.id === activeNav);
    const doc = folder ? (folder.docs || []).find(d => d.id === docId) : null;
    if (doc) {
      doc.name = newName;
      persistRoomData();
      hideVDRModal();
      renderAll();
    }
  }

  function exportFolder() {
    if (window.showToast) window.showToast('Exporting all folder files as .ZIP archive...', 'info');
  }

  function resendInvite(startupName) {
    closeAllContextMenus();
    if (window.showToast) window.showToast(`Invitation resent to ${startupName}`);
  }

  function copyAccessLink(startupName) {
    closeAllContextMenus();
    if (window.showToast) window.showToast(`Secure link copied for ${startupName}`);
  }

  function revokeStartupAccess(index) {
    closeAllContextMenus();
    if (roomData.sharedStartups && roomData.sharedStartups[index]) {
      const name = roomData.sharedStartups[index].name;
      roomData.sharedStartups.splice(index, 1);
      persistRoomData();
      renderAll();
      if (window.showToast) window.showToast(`Access revoked for ${name}`);
    }
  }

  /* ── RIGHT SLIDE-OVER DRAWER: SHARE DATA ROOM (PIPELINE STARTUP CARDS) ── */
  function openShareVdrDrawer() {
    const bodyHtml = `
      <p style="font-size:11.5px; color:#6A6A68; margin-bottom:14px; line-height:1.5;">
        Select a startup currently under Due Diligence in your pipeline to grant access to <strong>${roomData.name}</strong>.
      </p>
      <div style="display:flex; flex-direction:column; gap:10px;">
        ${DUE_DILIGENCE_PIPELINE_STARTUPS.map(s => {
          const alreadyShared = (roomData.sharedStartups || []).some(ss => ss.name === s.name);
          return `
            <div style="background:#FFFFFF; border:1px solid #E0E0DE; border-radius:8px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:12px; transition:border-color 0.12s, box-shadow 0.12s;">
              <div style="display:flex; align-items:center; gap:10px; flex:1; min-width:0;">
                <div style="width:34px; height:34px; border-radius:6px; background:#1A1A18; color:#FFFFFF; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:11px; flex-shrink:0;">${s.avatar}</div>
                <div style="flex:1; min-width:0;">
                  <div style="display:flex; align-items:center; gap:6px;">
                    <span style="font-size:12.5px; font-weight:800; color:#1A1A18; line-height:1.2;">${s.name}</span>
                    <span class="vdr-type-tag" style="font-size:8.5px; padding:1px 5px; background:#F0F0EE; border-radius:3px; font-weight:700; color:#4A4A48; text-transform:uppercase;">${s.sector}</span>
                  </div>
                  <div style="font-size:11px; color:#6A6A68; margin-top:2px;">${s.founder} · <span style="color:#8A8A88;">${s.email}</span></div>
                </div>
              </div>
              ${alreadyShared ? `
                <span style="font-size:10px; font-weight:700; color:#047857; background:#ECFDF5; padding:4px 8px; border-radius:4px; border:1px solid #A7F3D0; white-space:nowrap;">Already Shared</span>
              ` : `
                <button type="button" class="btn btn-primary" onclick="confirmShareVDRWithStartup('${s.id}')" style="font-size:11px; padding:5px 12px; gap:4px; flex-shrink:0; white-space:nowrap; background:#1A1A18; color:#FFFFFF; border-radius:6px; cursor:pointer;">
                  <i data-lucide="send" style="width:11px; height:11px;"></i> Share VDR
                </button>
              `}
            </div>
          `;
        }).join('')}
      </div>
    `;

    const footerHtml = `
      <div style="display:flex; justify-content:flex-end; width:100%;">
        <button type="button" class="btn btn-outline" onclick="window.closeDrawer()" style="font-size:11.5px; padding:6px 14px;">Close</button>
      </div>
    `;

    if (window.openDrawer) {
      window.openDrawer('Share Data Room with Startup', `Due Diligence Pipeline Startups`, bodyHtml, footerHtml);
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }
  }

  function confirmShareVDRWithStartup(dealId) {
    const startup = DUE_DILIGENCE_PIPELINE_STARTUPS.find(s => s.id === dealId);
    if (!startup) return;
    const today = new Date().toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
    if (!roomData.sharedStartups) roomData.sharedStartups = [];
    roomData.sharedStartups.unshift({
      id: 's_' + Date.now(),
      name: startup.name,
      avatar: startup.avatar,
      contact: startup.founder,
      email: startup.email,
      date: today,
      receivedOn: 'Pending',
      status: 'In Progress',
      progress: 0,
      docsCount: '0 / ' + (roomData.folders || []).reduce((acc, f) => acc + (f.docs || []).length, 0) + ' docs'
    });
    persistRoomData();
    renderAll();
    openShareVdrDrawer(); // re-render drawer showing "Already Shared"
    if (window.showToast) window.showToast(`Data room successfully shared with ${startup.name}!`);
  }

  /* ── LOCAL MODAL SYSTEM ── */
  function showVDRModal(title, bodyHtml) {
    closeAllContextMenus();
    document.getElementById('vdrModalTitle').textContent = title;
    document.getElementById('vdrModalBody').innerHTML = bodyHtml;
    document.getElementById('vdrModalBackdrop').style.display = 'flex';
    if (typeof lucide !== 'undefined') lucide.createIcons();
  }
  function hideVDRModal() {
    document.getElementById('vdrModalBackdrop').style.display = 'none';
    document.getElementById('vdrModalBody').innerHTML = '';
  }
  function handleVDRBackdropClick(e) {
    if (e.target === document.getElementById('vdrModalBackdrop')) hideVDRModal();
  }
</script>
</body>
</html>
