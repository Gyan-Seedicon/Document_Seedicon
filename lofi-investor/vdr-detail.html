<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VDR Data Room Detail — Seedicon Investor Platform</title>
  <link rel="stylesheet" href="./css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* ── Split Workspace Layout ── */
    .vdr-workspace-wrap {
      display: flex;
      flex: 1;
      height: calc(100vh - 46px);
      overflow: hidden;
      background: #FFFFFF;
    }

    /* Left Folder Sidebar */
    .vdr-folder-sidebar {
      width: 240px;
      min-width: 240px;
      background: #FAFAFA;
      border-right: 1px solid #E4E4E2;
      display: flex;
      flex-direction: column;
      height: 100%;
      user-select: none;
    }

    .vdr-folder-sidebar-header {
      padding: 14px 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #EBEBEA;
      background: #FAFAFA;
    }

    .vdr-sidebar-room-name {
      font-size: 13.5px;
      font-weight: 800;
      color: #1A1A18;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
    }

    .vdr-sidebar-add-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      color: #7A7A78;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s ease;
    }

    .vdr-sidebar-add-btn:hover {
      background: #EBEBEA;
      color: #1A1A18;
    }

    .vdr-folder-nav-list {
      padding: 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      overflow-y: auto;
    }

    .vdr-nav-section-label {
      font-size: 9.5px;
      font-weight: 800;
      color: #8C8C88;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 10px 10px 4px;
    }

    .vdr-nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #4A4A48;
      cursor: pointer;
      transition: all 0.1s ease;
      position: relative;
    }

    .vdr-nav-item:hover {
      background: #EFEFED;
      color: #1A1A18;
    }

    .vdr-nav-item.active {
      background: #EAEAE8;
      color: #1A1A18;
      font-weight: 700;
    }

    .vdr-nav-item-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .vdr-nav-item-icon {
      color: #7A7A78;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .vdr-nav-item.active .vdr-nav-item-icon {
      color: #1A1A18;
    }

    .vdr-nav-item-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .vdr-nav-badge {
      font-size: 10px;
      font-weight: 700;
      color: #7A7A78;
      background: #E2E2E0;
      padding: 1px 6px;
      border-radius: 10px;
    }

    .vdr-nav-item.active .vdr-nav-badge {
      background: #1A1A18;
      color: #FFFFFF;
    }

    .vdr-nav-item-actions {
      display: none;
      align-items: center;
      gap: 2px;
    }

    .vdr-nav-item:hover .vdr-nav-item-actions {
      display: flex;
    }

    .vdr-nav-dot-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      color: #8A8A88;
      padding: 2px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vdr-nav-dot-btn:hover {
      color: #1A1A18;
      background: rgba(0, 0, 0, 0.08);
    }

    .vdr-add-folder-row-btn {
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px dashed #D0D0CE;
      background: transparent;
      color: #6A6A68;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.1s ease;
      font-family: inherit;
      width: 100%;
      text-align: left;
    }

    .vdr-add-folder-row-btn:hover {
      background: #EFEFED;
      color: #1A1A18;
      border-color: #1A1A18;
    }

    /* Sidebar Footer Usage Indicator */
    .vdr-folder-sidebar-footer {
      padding: 10px 14px;
      border-top: 1px solid #EBEBEA;
      background: #FAFAFA;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .vdr-usage-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1A1A18;
      color: #FFFFFF;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 10.5px;
      font-weight: 700;
    }

    .vdr-usage-circle {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #FFFFFF;
    }

    .vdr-upgrade-link {
      font-size: 11px;
      font-weight: 700;
      color: #2563EB;
      text-decoration: none;
      cursor: pointer;
    }

    .vdr-upgrade-link:hover {
      text-decoration: underline;
    }

    /* ── Right Content Area ── */
    .vdr-main-workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow-y: auto;
      background: #FFFFFF;
    }

    /* Top Folder Action Header */
    .vdr-folder-topbar {
      padding: 12px 20px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #EBEBEA;
      background: #FFFFFF;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .vdr-folder-heading {
      font-size: 17px;
      font-weight: 800;
      color: #1A1A18;
      letter-spacing: -0.02em;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .vdr-topbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .vdr-btn-icon {
      background: #FFFFFF;
      border: 1px solid #DCDCDA;
      border-radius: 6px;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4A4A48;
      cursor: pointer;
      transition: all 0.1s;
    }

    .vdr-btn-icon:hover {
      background: #F0F0EE;
      color: #1A1A18;
    }

    .vdr-btn-outline {
      background: #FFFFFF;
      border: 1px solid #DCDCDA;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 11.5px;
      font-weight: 600;
      color: #3A3A38;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: inherit;
      transition: all 0.1s;
    }

    .vdr-btn-outline:hover {
      background: #F0F0EE;
      color: #1A1A18;
      border-color: #B0B0AE;
    }

    .vdr-btn-primary {
      background: #1A1A18;
      border: 1px solid #1A1A18;
      border-radius: 6px;
      padding: 6px 13px;
      font-size: 11.5px;
      font-weight: 700;
      color: #FFFFFF;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: inherit;
      transition: all 0.1s;
      position: relative;
    }

    .vdr-btn-primary:hover {
      background: #2A2A28;
    }

    .vdr-btn-danger {
      background: #DC2626;
      border: 1px solid #DC2626;
      border-radius: 6px;
      padding: 6px 13px;
      font-size: 11.5px;
      font-weight: 700;
      color: #FFFFFF;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: inherit;
      transition: all 0.1s;
    }

    .vdr-btn-danger:hover {
      background: #B91C1C;
      border-color: #B91C1C;
    }

    .vdr-btn-success {
      background: #047857;
      border: 1px solid #047857;
      border-radius: 6px;
      padding: 6px 13px;
      font-size: 11.5px;
      font-weight: 700;
      color: #FFFFFF;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: inherit;
      transition: all 0.1s;
    }

    .vdr-btn-success:hover {
      background: #065F46;
      border-color: #065F46;
    }

    .vdr-btn-reject-outline {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 6px;
      padding: 6px 13px;
      font-size: 11.5px;
      font-weight: 700;
      color: #DC2626;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: inherit;
      transition: all 0.1s;
    }

    .vdr-btn-reject-outline:hover {
      background: #FEE2E2;
      border-color: #FCA5A5;
      color: #B91C1C;
    }

    /* Add New Dropdown Menu */
    .vdr-dropdown-wrap {
      position: relative;
      display: inline-block;
    }

    .vdr-dropdown-menu {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      background: #FFFFFF;
      border: 1px solid #DFDEDE;
      border-radius: 7px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
      min-width: 155px;
      z-index: 150;
      padding: 4px;
      display: none;
      flex-direction: column;
      gap: 2px;
    }

    .vdr-dropdown-menu.show {
      display: flex;
    }

    /* ── Condensed Files & Shared Table with Horizontal Scroll ── */
    .vdr-files-table-container {
      padding: 0;
      flex: 1;
      width: 100%;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
    }

    .vdr-table {
      width: 100%;
      min-width: 1050px;
      border-collapse: collapse;
      table-layout: auto;
    }

    .vdr-table th {
      text-align: left;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #8C8C88;
      padding: 9px 16px;
      border-bottom: 1px solid #EBEBEA;
      background: #FAFAFA;
      white-space: nowrap;
      overflow: visible;
      text-overflow: clip;
    }

    .vdr-table td {
      padding: 9px 16px;
      font-size: 12px;
      color: #3A3A38;
      border-bottom: 1px solid #F3F3F1;
      vertical-align: middle;
      white-space: nowrap;
      overflow: visible;
      text-overflow: clip;
    }

    .vdr-table tr:hover td {
      background: #FAFAFA;
    }

    .vdr-file-name-cell {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: #1A1A18;
      min-width: 0;
    }

    .vdr-file-name-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .vdr-file-icon {
      color: #6A6A68;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Template Chip with Close/Remove Icon */
    .vdr-template-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #F4F4F2;
      border: 1px solid #DFDEDE;
      padding: 2.5px 6px 2.5px 8px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
      color: #1A1A18;
      max-width: 220px;
      cursor: pointer;
      transition: all 0.12s ease;
      user-select: none;
      vertical-align: middle;
    }

    .vdr-template-chip:hover {
      background: #EAEAE8;
      border-color: #B0B0AE;
      color: #1D4ED8;
    }

    .vdr-template-chip-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .vdr-template-chip-remove {
      background: transparent;
      border: none;
      color: #8A8A88;
      cursor: pointer;
      padding: 1px;
      border-radius: 3px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 2px;
      transition: all 0.1s ease;
      line-height: 1;
    }

    .vdr-template-chip-remove:hover {
      background: rgba(0, 0, 0, 0.08);
      color: #DC2626;
    }

    /* Template Upload Dropzone */
    .vdr-template-upload-zone {
      border: 1px dashed #D0D0CE;
      background: #FAFAFA;
      border-radius: 7px;
      padding: 14px 16px;
      text-align: center;
      transition: all 0.12s ease;
      cursor: pointer;
    }

    .vdr-template-upload-zone:hover {
      background: #F4F4F2;
      border-color: #1A1A18;
    }

    .vdr-template-upload-zone.has-file {
      border-style: solid;
      background: #FFFFFF;
      border-color: #D8D8D6;
      padding: 8px 10px;
    }

    .vdr-template-remove-upload-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s ease;
    }

    .vdr-template-remove-upload-btn:hover {
      background: #FEE2E2;
    }

    /* Table Action Menu Column */
    .vdr-table-actions-th {
      width: 44px !important;
      min-width: 44px !important;
      max-width: 44px !important;
      padding: 8px 16px 8px 0 !important;
      text-align: right;
    }

    .vdr-table-actions-cell {
      width: 44px !important;
      min-width: 44px !important;
      max-width: 44px !important;
      padding: 6px 16px 6px 0 !important;
      text-align: right;
      overflow: visible !important;
      text-overflow: clip !important;
      white-space: nowrap !important;
    }

    /* Three dots Context Menu */
    .vdr-row-menu-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
    }

    .vdr-context-menu {
      position: absolute;
      top: 100%;
      right: 0;
      background: #FFFFFF;
      border: 1px solid #DFDEDE;
      border-radius: 7px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      min-width: 140px;
      z-index: 100;
      padding: 3px;
      display: none;
      flex-direction: column;
      gap: 1px;
    }

    .vdr-context-menu.show {
      display: flex;
    }

    .vdr-menu-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 9px;
      font-size: 11.5px;
      font-weight: 600;
      color: #1A1A18;
      background: transparent;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
      width: 100%;
      font-family: inherit;
      transition: background 0.08s;
    }

    .vdr-menu-item:hover {
      background: #F0F0EE;
    }

    .vdr-menu-item.danger {
      color: #DC2626;
    }

    .vdr-menu-item.danger:hover {
      background: #FEF2F2;
    }

    /* Empty Folder State */
    .vdr-empty-folder {
      padding: 48px 20px;
      text-align: center;
      background: #FAFAFA;
      border: 1px dashed #DCDCDA;
      border-radius: 8px;
      margin: 20px;
    }

    /* ── Cover Letter View ── */
    .vdr-cover-letter-wrap {
      padding: 16px 20px 24px;
      max-width: 760px;
    }

    .vdr-cover-card {
      background: #FAFAFA;
      border: 1px solid #E0E0DE;
      border-radius: 8px;
      padding: 20px;
    }

    .vdr-cover-title-input {
      font-size: 15px;
      font-weight: 800;
      color: #1A1A18;
      border: 1px solid #DCDCDA;
      border-radius: 6px;
      padding: 8px 12px;
      width: 100%;
      background: #FFFFFF;
      margin-bottom: 12px;
      font-family: inherit;
      outline: none;
    }

    .vdr-cover-title-input:focus {
      border-color: #1A1A18;
    }

    .vdr-cover-textarea {
      font-size: 12px;
      line-height: 1.6;
      color: #2A2A28;
      border: 1px solid #DCDCDA;
      border-radius: 6px;
      padding: 12px;
      width: 100%;
      height: 240px;
      background: #FFFFFF;
      font-family: inherit;
      outline: none;
      resize: vertical;
    }

    .vdr-cover-textarea:focus {
      border-color: #1A1A18;
    }

    /* ── Shared Startups Status & Progress ── */
    .vdr-progress-bar-bg {
      width: 80px;
      height: 5px;
      background: #EBEBEA;
      border-radius: 3px;
      overflow: hidden;
      display: inline-block;
      vertical-align: middle;
      margin-right: 6px;
    }

    .vdr-progress-bar-fill {
      height: 100%;
      background: #1A1A18;
      border-radius: 3px;
    }

    .vdr-status-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-transform: capitalize;
    }

    .vdr-status-pill.completed { background: #ECFDF5; color: #047857; border: 1px solid #A7F3D0; }
    .vdr-status-pill.review { background: #EFF6FF; color: #1D4ED8; border: 1px solid #BFDBFE; }
    .vdr-status-pill.progress { background: #FFFBEB; color: #B45309; border: 1px solid #FDE68A; }
    .vdr-status-pill.invited { background: #F4F4F5; color: #52525B; border: 1px solid #E4E4E7; }

    /* Top Breadcrumb */
    .vdr-breadcrumb-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 20px;
      background: #FFFFFF;
      border-bottom: 1px solid #E4E4E2;
      flex-shrink: 0;
    }

    .vdr-breadcrumbs {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: #8A8A88;
    }

    .vdr-breadcrumbs a {
      color: #5A5A58;
      text-decoration: none;
      font-weight: 600;
    }

    .vdr-breadcrumbs a:hover {
      color: #1A1A18;
    }

    .vdr-breadcrumbs .curr {
      color: #1A1A18;
      font-weight: 700;
    }

    /* Local Modal Box */
    .vdr-modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.35);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeInBd 0.12s ease;
    }
    @keyframes fadeInBd { from { opacity:0; } to { opacity:1; } }
    .vdr-modal-box {
      background: #FFFFFF;
      border-radius: 8px;
      border: 1px solid #E0E0DE;
      width: 480px;
      max-width: 94vw;
      padding: 0;
      box-shadow: 0 16px 40px rgba(0,0,0,0.14);
      position: relative;
    }
    .vdr-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #EBEBEA;
      padding: 12px 16px;
    }
    .vdr-modal-title { font-size: 13.5px; font-weight: 800; color: #1A1A18; }
    .vdr-modal-close {
      background: transparent; border: none; cursor: pointer; color: #7A7A78;
      display: flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; border-radius: 4px; font-size: 16px;
    }
    .vdr-modal-close:hover { background: #F0F0EE; color: #1A1A18; }
    .vdr-modal-body { padding: 16px; }
    .vdr-modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid #EBEBEA;
      margin-top: 14px;
    }
    .field-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .field-label { font-size: 11px; font-weight: 700; color: #3A3A38; }
    .field-input {
      border: 1px solid #DCDCDA; border-radius: 6px; padding: 7px 10px;
      font-size: 12px; font-family: Inter, sans-serif; color: #1A1A18;
      background: #FFFFFF; outline: none; width: 100%; box-sizing: border-box;
    }
    .field-input:focus { border-color: #1A1A18; }

    /* ── Share VDR Drawer & Search Bar Styles ── */
    .vdr-drawer-search-wrap {
      margin-bottom: 12px;
    }

    .vdr-drawer-search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #FAFAFA;
      border: 1px solid #DCDCDA;
      border-radius: 7px;
      padding: 7px 11px;
      transition: all 0.12s ease;
    }

    .vdr-drawer-search-box:focus-within {
      background: #FFFFFF;
      border-color: #1A1A18;
      box-shadow: 0 0 0 2px rgba(26, 26, 24, 0.08);
    }

    .vdr-drawer-search-icon {
      width: 14px;
      height: 14px;
      color: #7A7A78;
      flex-shrink: 0;
    }

    .vdr-drawer-search-input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 12px;
      font-family: inherit;
      color: #1A1A18;
      width: 100%;
    }

    .vdr-drawer-search-input::placeholder {
      color: #8C8C88;
    }

    .vdr-drawer-search-clear {
      background: transparent;
      border: none;
      color: #8A8A88;
      cursor: pointer;
      padding: 2px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s ease;
    }

    .vdr-drawer-search-clear:hover {
      background: #EBEBEA;
      color: #1A1A18;
    }

    .vdr-drawer-search-meta {
      font-size: 10.5px;
      font-weight: 600;
      color: #8A8A88;
      margin-top: 5px;
      padding-left: 2px;
    }

    .vdr-drawer-startups-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .vdr-drawer-startup-card {
      background: #FFFFFF;
      border: 1px solid #E0E0DE;
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: all 0.12s ease;
    }

    .vdr-drawer-startup-card:hover {
      border-color: #C8C8C6;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .vdr-drawer-startup-card.is-shared {
      background: #FAFAFA;
      border-color: #E2E2E0;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .vdr-drawer-startup-card.is-shared:hover {
      background: #FFFFFF;
      border-color: #1A1A18;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
    }

    .vdr-already-shared-link {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: all 0.1s ease;
    }

    .vdr-already-shared-link:hover .vdr-already-shared-text {
      color: #047857;
      text-decoration: underline;
    }

    .vdr-already-shared-text {
      font-size: 11.5px;
      font-weight: 700;
      color: #059669;
      display: inline-flex;
      align-items: center;
      gap: 3.5px;
      line-height: 1.2;
      cursor: pointer;
    }

    .vdr-view-comment-link-btn {
      background: transparent;
      border: none;
      color: #2563EB;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3.5px;
      padding: 2px 4px;
      margin-right: -4px;
      border-radius: 3px;
      font-family: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
      transition: all 0.1s ease;
    }

    .vdr-view-comment-link-btn:hover {
      color: #1D4ED8;
      background: #EFF6FF;
    }

    .vdr-share-card-btn {
      font-size: 11px;
      padding: 6px 13px;
      gap: 5px;
      white-space: nowrap;
      flex-shrink: 0;
      background: #1A1A18;
      color: #FFFFFF;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      font-family: inherit;
      border: 1px solid #1A1A18;
      transition: background 0.1s ease;
    }

    .vdr-share-card-btn:hover {
      background: #2E2E2C;
    }

    .vdr-quick-chip {
      background: #F4F4F2;
      border: 1px solid #DFDEDE;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 10.5px;
      font-weight: 600;
      color: #3A3A38;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.1s ease;
    }

    .vdr-quick-chip:hover {
      background: #EAEAE8;
      color: #1A1A18;
      border-color: #A8A8A4;
    }

    .vdr-share-modal-startup-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #FAFAFA;
      border: 1px solid #E2E2E0;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }

    .vdr-share-modal-avatar {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      background: #1A1A18;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 11px;
      flex-shrink: 0;
    }

    .vdr-share-modal-room-info {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #5A5A58;
      background: #F8F8F6;
      border: 1px dashed #D8D8D6;
      border-radius: 6px;
      padding: 7px 10px;
    }

    .vdr-share-modal-note {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      font-size: 11px;
      color: #4A4A48;
      background: #EFF6FF;
      border: 1px solid #BFDBFE;
      border-radius: 6px;
      padding: 8px 10px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
<div class="app-container">
  <div id="appHeaderSlot"></div>
  <div class="main-workspace" style="display:flex; flex-direction:row;">
    <div id="tinySidebarSlot"></div>
    <div id="mainSidebarSlot"></div>

    <main class="content-scrollable" style="padding:0; display:flex; flex-direction:column; background:#FFFFFF;">

      <!-- ── TOP BREADCRUMB NAVIGATION BAR ── -->
      <div class="vdr-breadcrumb-bar">
        <div class="vdr-breadcrumbs">
          <a href="./vdr.html">VDR (Data Room)</a>
          <i data-lucide="chevron-right" style="width:12px; height:12px; color:#A8A8A4;"></i>
          <span class="curr" id="breadcrumbRoomName">Seed</span>
        </div>
      </div>

      <!-- ── SPLIT WORKSPACE: SIDEBAR + MAIN CONTENT ── -->
      <div class="vdr-workspace-wrap">
        
        <!-- Left Folder Sidebar -->
        <aside class="vdr-folder-sidebar">
          <div class="vdr-folder-sidebar-header">
            <span class="vdr-sidebar-room-name" id="sidebarRoomTitle">Seed</span>
            <button class="vdr-sidebar-add-btn" onclick="openAddFolderModal()" title="Create new folder">
              <i data-lucide="plus" style="width:14px; height:14px;"></i>
            </button>
          </div>

          <div class="vdr-folder-nav-list" id="vdrSidebarNav">
            <!-- Rendered dynamically -->
          </div>

          <!-- Footer Usage Indicator -->
          <div class="vdr-folder-sidebar-footer">
            <div class="vdr-usage-pill">
              <span class="vdr-usage-circle"></span>
              <span id="fileUsageCount">9/25 File used</span>
            </div>
            <a class="vdr-upgrade-link" onclick="if(window.showToast) window.showToast('Upgrade to unlimited files plan','info')">Upgrade</a>
          </div>
        </aside>

        <!-- Right Main Workspace Content Area -->
        <section class="vdr-main-workspace">
          
          <!-- Top Folder Action Header -->
          <div class="vdr-folder-topbar">
            <h2 class="vdr-folder-heading" id="activeSectionTitle">
              <span id="activeSectionName">General</span>
            </h2>

            <div class="vdr-topbar-actions" id="folderTopActions">
              <!-- Rendered via JS -->
            </div>
          </div>

          <!-- Dynamic Folder / Document / Shared Table Content Area -->
          <div id="vdrMainContent" class="vdr-files-table-container">
            <!-- Rendered via JS -->
          </div>

        </section>

      </div>

    </main>
  </div>
</div>

<!-- Local Modal -->
<div id="vdrModalBackdrop" style="display:none;" class="vdr-modal-backdrop" onclick="handleVDRBackdropClick(event)">
  <div class="vdr-modal-box" onclick="event.stopPropagation()">
    <div class="vdr-modal-header">
      <span class="vdr-modal-title" id="vdrModalTitle">Modal</span>
      <button class="vdr-modal-close" onclick="hideVDRModal()" title="Close">&#x2715;</button>
    </div>
    <div class="vdr-modal-body" id="vdrModalBody"></div>
  </div>
</div>

<div id="modalSlot"></div>

<script src="./js/components.js"></script>
<script src="./js/vdr-mock-data.js"></script>
<script src="./js/app.js"></script>
<script>
  let roomData = null;
  let activeNav = 'general'; // 'cover-letter', 'shared-startups', or folderId

  document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id') || 'vdr1';
    const customName = params.get('name');

    // Check localStorage first
    let saved = null;
    try {
      saved = JSON.parse(localStorage.getItem('vdr_' + id));
    } catch(e) {}

    if (saved && saved.folders && saved.folders.length > 0) {
      roomData = saved;
      // If legacy localStorage had all 8 mock startups shared, normalize to 1 shared startup (Alpha Health)
      if (roomData.sharedStartups && roomData.sharedStartups.length === 8 && roomData.sharedStartups.some(s => s.name === 'SkyTrack Mobility')) {
        roomData.sharedStartups = [
          roomData.sharedStartups.find(s => s.name === 'Alpha Health') || {
            id: 's1', name: 'Alpha Health', avatar: 'AH', contact: 'Dr. Sarah Chen', email: 'sarah@alphahealth.com',
            date: 'Jan 14, 2026', receivedOn: 'Feb 12, 2026', status: 'In Review', progress: 75, docsCount: '18 / 24 docs',
            comment: 'Please ensure FY25 Audited Statements and cap table matrix are provided before the partner meeting.'
          }
        ];
        persistRoomData();
      }
    } else if (window.SEED_VDR_DATA && window.SEED_VDR_DATA[id]) {
      roomData = JSON.parse(JSON.stringify(window.SEED_VDR_DATA[id]));
    } else if (typeof window.getFilledVdrPreset === 'function') {
      roomData = window.getFilledVdrPreset(id, customName ? decodeURIComponent(customName) : 'New Data Room');
    } else {
      roomData = {
        id,
        name: customName ? decodeURIComponent(customName) : 'New Data Room',
        folders: [
          { id: 'general', title: 'General', docs: [] }
        ],
        coverLetter: "Welcome to our Virtual Data Room.\n\nPlease upload all requested documents according to the checklist.",
        sharedStartups: [
          { id: 's1', name: 'Alpha Health', avatar: 'AH', contact: 'Dr. Sarah Chen', email: 'sarah@alphahealth.com', date: 'Jan 14, 2026', receivedOn: 'Feb 12, 2026', status: 'In Review', progress: 75, docsCount: '18 / 24 docs', comment: 'Please ensure FY25 Audited Statements and cap table matrix are provided before the partner meeting.' }
        ]
      };
    }

    renderAll();
  });

  // Global click to close dropdowns and context menus
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.vdr-dropdown-wrap')) {
      document.getElementById('addNewDropdownMenu')?.classList.remove('show');
    }
    if (!e.target.closest('.vdr-row-menu-wrap')) {
      closeAllContextMenus();
    }
  });

  function closeAllContextMenus() {
    document.querySelectorAll('.vdr-context-menu.show').forEach(m => m.classList.remove('show'));
    document.getElementById('addNewDropdownMenu')?.classList.remove('show');
  }

  function toggleAddNewMenu(e) {
    e.stopPropagation();
    closeAllContextMenus();
    document.getElementById('addNewDropdownMenu')?.classList.toggle('show');
  }

  function persistRoomData() {
    try {
      localStorage.setItem('vdr_' + roomData.id, JSON.stringify(roomData));
    } catch(e) {}
  }

  function renderAll() {
    if (!roomData) return;
    document.getElementById('breadcrumbRoomName').textContent = roomData.name;
    document.getElementById('sidebarRoomTitle').textContent = roomData.name;

    renderSidebar();
    renderActiveContent();
    updateFileUsage();
    if (typeof lucide !== 'undefined') lucide.createIcons();
  }

  function updateFileUsage() {
    let count = 0;
    (roomData.folders || []).forEach(f => {
      count += (f.docs || []).length;
    });
    const badge = document.getElementById('fileUsageCount');
    if (badge) badge.textContent = `${count}/25 File used`;
  }

  /* ── SIDEBAR RENDERING ── */
  function renderSidebar() {
    const list = document.getElementById('vdrSidebarNav');
    if (!list) return;

    const startupsCount = (roomData.sharedStartups || []).length;

    let html = `
      <!-- Cover Letter -->
      <div class="vdr-nav-item ${activeNav === 'cover-letter' ? 'active' : ''}" onclick="selectNav('cover-letter')">
        <div class="vdr-nav-item-left">
          <span class="vdr-nav-item-icon"><i data-lucide="file-text" style="width:14px; height:14px;"></i></span>
          <span class="vdr-nav-item-text">Cover letter</span>
        </div>
      </div>

      <!-- Shared Startups (Surface View) -->
      <div class="vdr-nav-item ${activeNav === 'shared-startups' ? 'active' : ''}" onclick="selectNav('shared-startups')">
        <div class="vdr-nav-item-left">
          <span class="vdr-nav-item-icon"><i data-lucide="users" style="width:14px; height:14px;"></i></span>
          <span class="vdr-nav-item-text">Shared Startups</span>
        </div>
        <span class="vdr-nav-badge">${startupsCount}</span>
      </div>

      <div class="vdr-nav-section-label">Folders</div>
    `;

    // Folder Items
    (roomData.folders || []).forEach(f => {
      const isGeneral = f.id === 'general';
      const isActive = activeNav === f.id;
      const docCount = (f.docs || []).length;

      html += `
        <div class="vdr-nav-item ${isActive ? 'active' : ''}" onclick="selectNav('${f.id}')">
          <div class="vdr-nav-item-left">
            <span class="vdr-nav-item-icon"><i data-lucide="folder" style="width:14px; height:14px;"></i></span>
            <span class="vdr-nav-item-text">${f.title}</span>
          </div>
          <span class="vdr-nav-badge" style="font-size:9.5px; opacity:0.75;">${docCount}</span>
          ${!isGeneral ? `
            <div class="vdr-nav-item-actions" onclick="event.stopPropagation()">
              <button class="vdr-nav-dot-btn" onclick="openFolderActions('${f.id}', event)" title="Options">
                <i data-lucide="more-horizontal" style="width:12px; height:12px;"></i>
              </button>
            </div>
          ` : ''}
        </div>
      `;
    });

    html += `
      <button class="vdr-add-folder-row-btn" onclick="openAddFolderModal()">
        <i data-lucide="plus" style="width:13px; height:13px;"></i>
        <span>New folder</span>
      </button>
    `;

    list.innerHTML = html;
  }

  function selectNav(navId) {
    activeNav = navId;
    closeAllContextMenus();
    renderAll();
  }

  /* ── MAIN CONTENT RENDERING ── */
  function renderActiveContent() {
    const container = document.getElementById('vdrMainContent');
    const headerTitle = document.getElementById('activeSectionName');
    const topActions = document.getElementById('folderTopActions');
    if (!container) return;

    // 1. COVER LETTER VIEW
    if (activeNav === 'cover-letter') {
      if (headerTitle) headerTitle.textContent = 'Cover letter';
      if (topActions) {
        topActions.style.display = 'flex';
        topActions.innerHTML = `
          <button class="vdr-btn-icon" onclick="autofillVdrData()" title="Auto-fill sample folders & files (Filled State)">
            <i data-lucide="sparkles" style="width:13px; height:13px; color:#1A1A18;"></i>
          </button>
        `;
      }

      container.innerHTML = `
        <div class="vdr-cover-letter-wrap">
          <div class="vdr-cover-card">
            <label style="font-size:11px; font-weight:700; color:#3A3A38; margin-bottom:6px; display:block;">Cover Letter Title</label>
            <input id="coverTitleInput" class="vdr-cover-title-input" value="Welcome to ${roomData.name}" />

            <label style="font-size:11px; font-weight:700; color:#3A3A38; margin-bottom:6px; display:block;">Letter Body</label>
            <textarea id="coverBodyInput" class="vdr-cover-textarea" placeholder="Write instructions for founders viewing this data room...">${roomData.coverLetter || ''}</textarea>

            <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:14px;">
              <button class="vdr-btn-outline" onclick="previewCoverLetter()">
                <i data-lucide="eye" style="width:12px; height:12px;"></i> Preview
              </button>
              <button class="vdr-btn-primary" onclick="saveCoverLetter()">
                <i data-lucide="check" style="width:12px; height:12px;"></i> Save Cover Letter
              </button>
            </div>
          </div>
        </div>
      `;
      return;
    }

    // 2. SHARED STARTUPS SURFACE TABLE VIEW
    if (activeNav === 'shared-startups') {
      if (headerTitle) headerTitle.textContent = 'Shared Startups';
      if (topActions) {
        topActions.style.display = 'flex';
        topActions.innerHTML = `
          <button class="vdr-btn-icon" onclick="autofillVdrData()" title="Auto-fill sample folders & files (Filled State)">
            <i data-lucide="sparkles" style="width:13px; height:13px; color:#1A1A18;"></i>
          </button>
          <button class="vdr-btn-primary" onclick="openShareVdrDrawer()" style="font-size:11.5px; padding:6px 13px; gap:6px;">
            <i data-lucide="send" style="width:12px; height:12px;"></i>
            <span>Share Vault with Startup</span>
          </button>
        `;
      }

      const startups = roomData.sharedStartups || [];

      if (startups.length === 0) {
        container.innerHTML = `
          <div class="vdr-empty-folder">
            <div style="width:36px; height:36px; border-radius:50%; background:#EFEFED; display:inline-flex; align-items:center; justify-content:center; margin-bottom:8px;">
              <i data-lucide="users" style="width:18px; height:18px; color:#8A8A88;"></i>
            </div>
            <div style="font-size:13px; font-weight:700; color:#1A1A18; margin-bottom:3px;">No startups shared yet</div>
            <p style="font-size:11.5px; color:#8C8C88; max-width:340px; margin:0 auto 14px;">Invite founders to access this Virtual Data Room and review or upload requested files.</p>
            <div style="display:flex; align-items:center; justify-content:center; gap:8px;">
              <button class="vdr-btn-primary" onclick="openShareVdrDrawer()" style="display:inline-flex;">
                <i data-lucide="send" style="width:12px; height:12px;"></i> Share Room with Startup
              </button>
              <button class="vdr-btn-outline" onclick="autofillVdrData()" style="display:inline-flex;">
                <i data-lucide="sparkles" style="width:12px; height:12px;"></i> Auto-fill Sample Data
              </button>
            </div>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <table class="vdr-table">
          <thead>
            <tr>
              <th style="width:20%;">Startup</th>
              <th style="width:18%;">Contact / Founder</th>
              <th style="width:12%;">Date Shared</th>
              <th style="width:12%;">Received On</th>
              <th style="width:10%;">Status</th>
              <th style="width:10%;">Uploads</th>
              <th style="width:18%;">Comment / Notes</th>
              <th class="vdr-table-actions-th"></th>
            </tr>
          </thead>
          <tbody>
            ${startups.map((s, idx) => {
              let statusClass = 'invited';
              if (s.status === 'Completed') statusClass = 'completed';
              else if (s.status === 'In Review') statusClass = 'review';
              else if (s.status === 'In Progress') statusClass = 'progress';

              const comment = s.comment || '';

              return `
                <tr>
                  <td>
                    <div style="display:flex; align-items:center; gap:8px;">
                      <div style="width:26px; height:26px; border-radius:5px; background:#1A1A18; color:#FFFFFF; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:9.5px; flex-shrink:0;">${s.avatar || s.name.slice(0,2).toUpperCase()}</div>
                      <a href="./startup-detail.html?id=${s.id || 'sup_1'}&name=${encodeURIComponent(s.name)}&tab=vdr" style="font-weight:700; color:#1A1A18; text-decoration:none; display:inline-flex; align-items:center; gap:4px;" title="Open ${s.name} Data Room (VDR)">
                        ${s.name}
                        <i data-lucide="arrow-up-right" style="width:11px; height:11px; color:#8C8C88;"></i>
                      </a>
                    </div>
                  </td>
                  <td>
                    <div style="color:#1A1A18; font-weight:600;">${s.contact}</div>
                    <div style="font-size:10.5px; color:#8A8A88;">${s.email || ''}</div>
                  </td>
                  <td style="color:#5A5A58;">${s.date}</td>
                  <td style="color:#7A7A78;">${s.receivedOn || '—'}</td>
                  <td><span class="vdr-status-pill ${statusClass}">${s.status}</span></td>
                  <td>
                    <div style="display:flex; align-items:center;">
                      <div class="vdr-progress-bar-bg">
                        <div class="vdr-progress-bar-fill" style="width:${s.progress || 0}%;"></div>
                      </div>
                      <span style="font-size:11px; font-weight:700; color:#1A1A18;">${s.progress || 0}%</span>
                    </div>
                  </td>
                  <td>
                    <div style="display:flex; align-items:center; gap:6px; cursor:pointer;" onclick="openEditStartupNoteModal(${idx})" title="Click to edit note">
                      <span style="font-size:11px; color:#4A4A48; max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                        ${comment ? comment : '<span style="color:#A0A09E; font-style:italic;">+ Add note</span>'}
                      </span>
                      <i data-lucide="edit-2" style="width:10px; height:10px; color:#8A8A88; flex-shrink:0;"></i>
                    </div>
                  </td>
                  <td class="vdr-table-actions-cell">
                    <div class="vdr-row-menu-wrap" onclick="event.stopPropagation()">
                      <button class="vdr-nav-dot-btn" onclick="toggleStartupMenu('${s.id || 'st_' + idx}', event)" title="Actions">
                        <i data-lucide="more-horizontal" style="width:13px; height:13px;"></i>
                      </button>
                      <div class="vdr-context-menu" id="startupMenu-${s.id || 'st_' + idx}">
                        <button class="vdr-menu-item" onclick="openEditStartupNoteModal(${idx})">
                          <i data-lucide="edit-3" style="width:12px; height:12px;"></i>
                          <span>Edit Note / Comment</span>
                        </button>
                        <button class="vdr-menu-item" onclick="resendInvite('${s.name}')">
                          <i data-lucide="send" style="width:12px; height:12px;"></i>
                          <span>Resend Invite</span>
                        </button>
                        <button class="vdr-menu-item" onclick="copyAccessLink('${s.name}')">
                          <i data-lucide="link" style="width:12px; height:12px;"></i>
                          <span>Copy Link</span>
                        </button>
                        <div style="height:1px; background:#EBEBEA; margin:2px 0;"></div>
                        <button class="vdr-menu-item danger" onclick="revokeStartupAccess(${idx})">
                          <i data-lucide="trash-2" style="width:12px; height:12px;"></i>
                          <span>Revoke Access</span>
                        </button>
                      </div>
                    </div>
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      `;
      return;
    }

    // 3. FOLDER VIEW (CONDENSED TABLE)
    if (topActions) {
      topActions.style.display = 'flex';
      topActions.innerHTML = `
        <button class="vdr-btn-icon" onclick="autofillVdrData()" title="Auto-fill sample folders & files (Filled State)">
          <i data-lucide="sparkles" style="width:13px; height:13px; color:#1A1A18;"></i>
        </button>
        <button class="vdr-btn-icon" onclick="exportFolder()" title="Download files">
          <i data-lucide="download" style="width:13px; height:13px;"></i>
        </button>
        <div class="vdr-row-menu-wrap">

  /* ── REMOVE TEMPLATE FROM DOCUMENT ── */
  function removeTemplateFromDoc(folderId, docId, e) {
    if (e) e.stopPropagation();
    const folder = (roomData.folders || []).find(f => f.id === folderId);
    if (!folder) return;
    const doc = (folder.docs || []).find(d => d.id === docId);
    if (doc) {
      const oldTemplate = doc.template;
      doc.template = null;
      persistRoomData();
      renderActiveContent();
      if (window.showToast) window.showToast(`Template "${oldTemplate}" removed from "${doc.name}"`, 'info');
    }
  }

  /* ── AUTO-FILL SAMPLE DATA (Filled State Demonstration) ── */
  function autofillVdrData() {
    const filled = (typeof window.getFilledVdrPreset === 'function') 
      ? window.getFilledVdrPreset(roomData.id, roomData.name)
      : (window.SEED_VDR_DATA ? window.SEED_VDR_DATA.vdr1 : null);
    
    if (filled) {
      roomData.folders = filled.folders;
      roomData.coverLetter = filled.coverLetter;
      roomData.sharedStartups = filled.sharedStartups;
    }

    persistRoomData();
    renderSidebar();
    renderActiveContent();
    updateFileUsage();
    if (typeof lucide !== 'undefined') lucide.createIcons();
    if (window.showToast) window.showToast('Sample folders, files & startups auto-filled!', 'sparkles');
  }

  /* ── ADD FILE MODAL (ONLY FILE NAME & UPLOAD TEMPLATE OPTION) ── */

    const folder = (roomData.folders || []).find(f => f.id === activeNav) || roomData.folders[0];
    currentUploadedTemplate = null;

    showVDRModal(`Add File to "${folder ? folder.title : 'Folder'}"`, `
      <div style="padding:4px 0 0;">

          <button type="button" class="vdr-btn-primary" onclick="confirmAddFile()">Add File</button>
        </div>
      </div>
    `);
    if (typeof lucide !== 'undefined') lucide.createIcons();
    setTimeout(() => document.getElementById('newDocNameInput')?.focus(), 60);
  }

  function handleTemplateFileSelected(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;

    const sizeKb = (file.size / 1024);
    const sizeStr = sizeKb > 1024 ? (sizeKb / 1024).toFixed(2) + ' MB' : sizeKb.toFixed(2) + ' KB';

    currentUploadedTemplate = {
      name: file.name,
      size: sizeStr
    };

    const prompt = document.getElementById('templateUploadPrompt');
    const preview = document.getElementById('templateUploadedPreview');
    const nameText = document.getElementById('uploadedTemplateNameText');
    const sizeText = document.getElementById('uploadedTemplateSizeText');
    const zone = document.getElementById('templateUploadZone');

    if (prompt) prompt.style.display = 'none';
    if (preview) preview.style.display = 'flex';
    if (nameText) nameText.textContent = file.name;
    if (sizeText) sizeText.textContent = sizeStr;
    if (zone) zone.classList.add('has-file');

    if (typeof lucide !== 'undefined') lucide.createIcons();
  }

  function clearUploadedTemplate(e) {
    if (e) e.stopPropagation();
    currentUploadedTemplate = null;
    const fileInput = document.getElementById('templateFileInput');
    if (fileInput) fileInput.value = '';

    const prompt = document.getElementById('templateUploadPrompt');
    const preview = document.getElementById('templateUploadedPreview');
    const zone = document.getElementById('templateUploadZone');

    if (prompt) prompt.style.display = 'flex';
    if (preview) preview.style.display = 'none';
    if (zone) zone.classList.remove('has-file');
  }

  function confirmAddFile() {
    const name = document.getElementById('newDocNameInput')?.value?.trim();
    if (!name) {
      if (window.showToast) window.showToast('Please enter a file name', 'alert-circle');
      return;
    }

    // Determine type from name or template or default
    let type = '.pdf';
    if (name.includes('.')) {
      type = '.' + name.split('.').pop().toLowerCase();
    } else if (currentUploadedTemplate && currentUploadedTemplate.name.includes('.')) {
      type = '.' + currentUploadedTemplate.name.split('.').pop().toLowerCase();
    }

    const template = currentUploadedTemplate ? currentUploadedTemplate.name : null;
    const size = currentUploadedTemplate ? currentUploadedTemplate.size : '248.10 KB';

    const folder = (roomData.folders || []).find(f => f.id === activeNav) || roomData.folders[0];
    if (folder) {
      if (!folder.docs) folder.docs = [];
      folder.docs.push({
        id: 'doc_' + Date.now(),
        name,
        template: template,
        size,
        type,
        date: new Date().toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' })
      });
      persistRoomData();
      hideVDRModal();
      renderAll();
      if (window.showToast) window.showToast(`File "${name}" added to ${folder.title}`);
    }
  }

      </div>

      <!-- Startups Container -->
      <div id="vdrPipelineStartupsList" class="vdr-drawer-startups-list"></div>
    `;

    const footerHtml = `
      <div style="display:flex; justify-content:flex-end; width:100%;">
        <button type="button" class="btn btn-outline" onclick="window.closeDrawer()" style="font-size:11.5px; padding:6px 14px;">Close</button>
      </div>
    `;

    if (window.openDrawer) {
      window.openDrawer('Share Data Room with Startup', `Due Diligence Pipeline Startups · ${roomData.name}`, bodyHtml, footerHtml);
      renderVdrPipelineStartups('');
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }
  }

  function handleVdrStartupSearch(val) {
    vdrCurrentSearchQuery = (val || '').trim();
    const clearBtn = document.getElementById('vdrStartupSearchClearBtn');
    if (clearBtn) clearBtn.style.display = vdrCurrentSearchQuery ? 'flex' : 'none';
    renderVdrPipelineStartups(vdrCurrentSearchQuery);
  }

  function clearVdrStartupSearch() {
    const input = document.getElementById('vdrStartupSearchInput');
    if (input) {
      input.value = '';
      input.focus();
    }
    handleVdrStartupSearch('');
  }

  function renderVdrPipelineStartups(query = '') {
    const container = document.getElementById('vdrPipelineStartupsList');
    const meta = document.getElementById('vdrStartupSearchMeta');
    if (!container) return;

    const pipelineList = window.VDR_PIPELINE_STARTUPS || [
      { id: 'dd_1', name: 'Alpha Health', avatar: 'AH', sector: 'Healthcare', founder: 'Dr. Sarah Chen', email: 'sarah@alphahealth.com' },
      { id: 'dd_2', name: 'NeuroPulse', avatar: 'NP', sector: 'MedTech', founder: 'Mark Evans', email: 'mark@neuropulse.io' },
      { id: 'dd_3', name: 'EcoPulse Energy', avatar: 'EP', sector: 'CleanTech', founder: 'Priya Sharma', email: 'priya@ecopulse.com' },
      { id: 'dd_4', name: 'Apex AI', avatar: 'AA', sector: 'AI / Software', founder: 'Vikram Mehta', email: 'vikram@apexai.io' },
      { id: 'dd_5', name: 'FinFlow Tech', avatar: 'FF', sector: 'FinTech', founder: 'Alexandre Dubois', email: 'alex@finflow.io' },
      { id: 'dd_6', name: 'LogiChain Labs', avatar: 'LC', sector: 'Logistics', founder: 'Rajan Menon', email: 'rajan@logichain.io' },
      { id: 'dd_7', name: 'BioCore Diagnostics', avatar: 'BC', sector: 'BioTech', founder: 'James Whitfield', email: 'james@biocore.com' },
      { id: 'dd_8', name: 'SkyTrack Mobility', avatar: 'ST', sector: 'Mobility', founder: 'Helen Cruz', email: 'helen@skytrack.io' }
    ];

    const q = query.toLowerCase();
    const filtered = pipelineList.filter(s => {
      if (!q) return true;
      return (
        s.name.toLowerCase().includes(q) ||
        (s.sector && s.sector.toLowerCase().includes(q)) ||
        (s.founder && s.founder.toLowerCase().includes(q)) ||
        (s.email && s.email.toLowerCase().includes(q))
      );
    });

    if (meta) {
      if (!q) {
        meta.textContent = `Showing all ${pipelineList.length} pipeline startups`;
      } else {
        meta.textContent = `Found ${filtered.length} of ${pipelineList.length} startups`;
      }
    }

    if (filtered.length === 0) {
      container.innerHTML = `
        <div style="text-align:center; padding:32px 16px; background:#FAFAFA; border:1px dashed #DCDCDA; border-radius:8px;">
          <div style="width:32px; height:32px; border-radius:50%; background:#EFEFED; display:inline-flex; align-items:center; justify-content:center; margin-bottom:8px;">
            <i data-lucide="search-x" style="width:16px; height:16px; color:#8A8A88;"></i>
          </div>
          <div style="font-size:12.5px; font-weight:700; color:#1A1A18; margin-bottom:2px;">No startups found</div>
          <p style="font-size:11px; color:#8A8A88; margin:0 0 10px;">No startups in your pipeline match "${query}".</p>
          <button type="button" class="vdr-btn-outline" onclick="clearVdrStartupSearch()" style="font-size:11px; padding:4px 10px;">
            Clear Search Filter
          </button>
        </div>
      `;
      if (typeof lucide !== 'undefined') lucide.createIcons();
      return;
    }

    container.innerHTML = filtered.map(s => {
      const sharedRecord = (roomData.sharedStartups || []).find(ss => ss.name.toLowerCase() === s.name.toLowerCase());
      const alreadyShared = !!sharedRecord;
      const sharedDate = sharedRecord ? (sharedRecord.date || 'Jan 14, 2026') : '';
      return `
        <div class="vdr-drawer-startup-card ${alreadyShared ? 'is-shared' : ''}" ${alreadyShared ? `onclick="window.location.href='./startup-detail.html?id=${s.id}&name=${encodeURIComponent(s.name)}&tab=vdr'"` : ''} title="${alreadyShared ? `Open ${s.name} Data Room (VDR)` : ''}">
          <div style="display:flex; align-items:center; gap:10px; flex:1; min-width:0;">
            <div style="width:34px; height:34px; border-radius:6px; background:#1A1A18; color:#FFFFFF; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:11px; flex-shrink:0;">
              ${s.avatar}
            </div>
            <div style="flex:1; min-width:0;">
              <div style="display:flex; align-items:center; gap:6px;">
                <span style="font-size:12.5px; font-weight:800; color:#1A1A18; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${s.name}</span>
                <span class="vdr-type-tag" style="font-size:8.5px; padding:1px 5px; background:#F0F0EE; border-radius:3px; font-weight:700; color:#4A4A48; text-transform:uppercase; flex-shrink:0;">${s.sector}</span>
              </div>
              <div style="font-size:11px; color:#6A6A68; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                ${s.founder} · <span style="color:#8A8A88;">${s.email}</span>
              </div>
            </div>
          </div>

          <div style="display:flex; flex-direction:column; align-items:flex-end; justify-content:center; gap:3px; flex-shrink:0;">
            ${alreadyShared ? `
              <a href="./startup-detail.html?id=${s.id}&name=${encodeURIComponent(s.name)}&tab=vdr" class="vdr-already-shared-link" onclick="event.stopPropagation()" title="Open ${s.name} Data Room (VDR)">
                <span class="vdr-already-shared-text">
                  Already Shared <i data-lucide="arrow-up-right" style="width:11px; height:11px;"></i>
                </span>
              </a>
              <div style="display:flex; align-items:center; gap:5px; font-size:10.5px; color:#7A7A78;">
                <span>Shared on ${sharedDate}</span>
                <span style="color:#D0D0CE; font-size:9px;">•</span>
                <button type="button" class="vdr-view-comment-link-btn" onclick="event.stopPropagation(); openViewStartupCommentModal('${s.name.replace(/'/g, "\\'")}')" title="View or edit diligence comments">
                  View Comment
                </button>
              </div>
            ` : `
              <button type="button" class="vdr-share-card-btn" onclick="openShareVDRModal('${s.id}')">
                <i data-lucide="send" style="width:11px; height:11px;"></i>
                <span>Share VDR</span>
              </button>
            `}
          </div>
        </div>
      `;
    }).join('');

    if (typeof lucide !== 'undefined') lucide.createIcons();
  }

  /* ── OPEN SHARE VDR POP-UP MODAL (ASKS COMMENT, CANCEL & SHARE BUTTONS) ── */
  function openShareVDRModal(dealId) {
    const pipelineList = window.VDR_PIPELINE_STARTUPS || [];
    const startup = pipelineList.find(s => s.id === dealId);
    if (!startup) return;

    showVDRModal(`Share Data Room with ${startup.name}`, `
      <div style="padding:4px 0 0;">
        <!-- Startup info card -->
        <div class="vdr-share-modal-startup-card">
          <div class="vdr-share-modal-avatar">${startup.avatar}</div>
          <div style="flex:1; min-width:0;">
            <div style="display:flex; align-items:center; gap:6px;">
              <span style="font-size:13px; font-weight:800; color:#1A1A18;">${startup.name}</span>
              <span class="vdr-type-tag" style="font-size:8.5px; padding:1px 5px; background:#F0F0EE; border-radius:3px; font-weight:700; color:#4A4A48; text-transform:uppercase;">${startup.sector}</span>
            </div>
            <div style="font-size:11px; color:#6A6A68; margin-top:2px;">
              ${startup.founder} · <span style="color:#8A8A88;">${startup.email}</span>
            </div>
          </div>
        </div>

        <div class="vdr-share-modal-room-info" style="margin-bottom:12px;">
          <i data-lucide="folder-lock" style="width:13px; height:13px; color:#1A1A18; flex-shrink:0;"></i>
          <span>Granting checklist upload access to: <strong>${roomData.name}</strong></span>
        </div>

        <div class="field-group" style="margin-bottom:8px;">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">
            <label class="field-label" style="margin:0;">Comments / Diligence Instructions</label>
            <span style="font-size:10px; color:#8A8A88; font-weight:600;">Optional</span>
          </div>
          <textarea id="modalShareCommentInput" class="field-input" rows="3" style="resize:vertical; font-size:11.5px; line-height:1.5; padding:8px 10px; height:75px;" placeholder="e.g. Please expedite FY25 audited statements, Cap Table, and SOC2 compliance report..."></textarea>
        </div>

        <!-- Quick Presets -->
        <div style="margin-bottom:12px;">
          <div style="font-size:10px; font-weight:700; color:#7A7A78; margin-bottom:4px; text-transform:uppercase; letter-spacing:0.04em;">Quick Suggestions:</div>
          <div style="display:flex; flex-wrap:wrap; gap:4px;">
            <button type="button" class="vdr-quick-chip" onclick="setShareModalPreset('Standard Due Diligence checklist dispatched. Please upload all required materials.')">+ Standard DD</button>
            <button type="button" class="vdr-quick-chip" onclick="setShareModalPreset('Please prioritize FY25 audited statements, cap table matrix, and latest MIS report.')">+ Financials Focus</button>
            <button type="button" class="vdr-quick-chip" onclick="setShareModalPreset('Please provide IP assignment deeds, founder employment agreements, and SOC2 report.')">+ Legal & IP</button>
          </div>
        </div>

        <div class="vdr-share-modal-note">
          <i data-lucide="info" style="width:13px; height:13px; color:#2563EB; flex-shrink:0;"></i>
          <span>An automated invitation email with secure upload link will be dispatched to <strong>${startup.email}</strong>.</span>
        </div>

        <div class="vdr-modal-footer">
          <button type="button" class="vdr-btn-outline" onclick="hideVDRModal()">Cancel</button>
          <button type="button" class="vdr-btn-primary" onclick="confirmExecuteShareVDR('${dealId}')">
            <i data-lucide="send" style="width:12px; height:12px;"></i>
            <span>Share Data Room</span>
          </button>
        </div>
      </div>
    `);

    setTimeout(() => {
      document.getElementById('modalShareCommentInput')?.focus();
    }, 60);
  }

  function setShareModalPreset(text) {
    const input = document.getElementById('modalShareCommentInput');
    if (input) {
      input.value = text;
      input.focus();
    }
  }

  function confirmExecuteShareVDR(dealId) {
    const pipelineList = window.VDR_PIPELINE_STARTUPS || [];
    const startup = pipelineList.find(s => s.id === dealId);
    if (!startup) return;

    const commentInput = document.getElementById('modalShareCommentInput');
    const comment = commentInput ? commentInput.value.trim() : '';

    const today = new Date().toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
    if (!roomData.sharedStartups) roomData.sharedStartups = [];
    
    // Check if not already in shared list
    const existingIdx = roomData.sharedStartups.findIndex(ss => ss.name.toLowerCase() === startup.name.toLowerCase());
    if (existingIdx === -1) {
      roomData.sharedStartups.unshift({
        id: 's_' + Date.now(),
        name: startup.name,
        avatar: startup.avatar,
        contact: startup.founder,
        email: startup.email,
        date: today,
        receivedOn: 'Pending',
        status: 'In Progress',
        progress: 0,
        comment: comment || 'Shared via Due Diligence pipeline',
        docsCount: '0 / ' + (roomData.folders || []).reduce((acc, f) => acc + (f.docs || []).length, 0) + ' docs'
      });
    } else {
      roomData.sharedStartups[existingIdx].comment = comment || roomData.sharedStartups[existingIdx].comment;
    }

    persistRoomData();
    hideVDRModal();
    renderAll();
    renderVdrPipelineStartups(vdrCurrentSearchQuery); // Re-render the drawer list with updated status!
    if (window.showToast) window.showToast(`Data room successfully shared with ${startup.name}!`, 'check-circle');
  }

  /* ── VIEW / EDIT STARTUP COMMENT MODAL ── */
  function openViewStartupCommentModal(startupName) {
    const startup = (roomData.sharedStartups || []).find(s => s.name.toLowerCase() === startupName.toLowerCase());
    if (!startup) {
      if (window.showToast) window.showToast(`Startup details not found`, 'alert-circle');
      return;
    }

    showVDRModal(`Comment — ${startup.name}`, `
      <div style="padding:4px 0 0;">
        <div style="display:flex; align-items:center; gap:10px; background:#FAFAFA; border:1px solid #E2E2E0; border-radius:8px; padding:10px 12px; margin-bottom:14px;">
          <div style="width:34px; height:34px; border-radius:6px; background:#1A1A18; color:#FFFFFF; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:11px; flex-shrink:0;">
            ${startup.avatar || startup.name.slice(0, 2).toUpperCase()}
          </div>
          <div style="flex:1; min-width:0;">
            <div style="font-size:12.5px; font-weight:800; color:#1A1A18;">${startup.name}</div>
            <div style="font-size:11px; color:#7A7A78;">Shared on ${startup.date || 'Jan 14, 2026'} · ${startup.contact || ''}</div>
          </div>
          <span class="vdr-status-pill ${startup.status === 'Completed' ? 'completed' : startup.status === 'In Review' ? 'review' : 'progress'}">${startup.status || 'In Progress'}</span>
        </div>

        <div class="field-group">
          <label class="field-label">Diligence Instructions & Notes for Founder</label>
          <textarea id="viewCommentTextInput" class="field-input" style="height:100px; resize:vertical; font-size:12px; line-height:1.5;" placeholder="No special instructions added...">${startup.comment || ''}</textarea>
        </div>

        <div class="vdr-modal-footer">
          <button type="button" class="vdr-btn-outline" onclick="hideVDRModal()">Close</button>
          <button type="button" class="vdr-btn-primary" onclick="saveViewStartupComment('${startup.name.replace(/'/g, "\\'")}')">
            <i data-lucide="check" style="width:12px; height:12px;"></i>
            <span>Save Changes</span>
          </button>
        </div>
      </div>
    `);
  }

  function saveViewStartupComment(startupName) {
    const text = document.getElementById('viewCommentTextInput')?.value?.trim() || '';
    const startup = (roomData.sharedStartups || []).find(s => s.name.toLowerCase() === startupName.toLowerCase());
    if (startup) {
      startup.comment = text;
      persistRoomData();
      hideVDRModal();
      renderAll();
      renderVdrPipelineStartups(vdrCurrentSearchQuery);
      if (window.showToast) window.showToast(`Comment updated for ${startup.name}!`, 'check-circle');
    }
  }

  /* ── TEMPLATE PREVIEW MODAL ── */
  function openTemplateViewer(templateName) {
    showVDRModal(`Template: ${templateName}`, `
      <div>
        <div style="display:flex; align-items:center; gap:10px; background:#F8F8F6; border:1px solid #E2E2E0; border-radius:8px; padding:14px; margin-bottom:14px;">
          <div style="width:36px; height:36px; border-radius:6px; background:#1A1A18; color:#FFFFFF; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            <i data-lucide="file-text" style="width:18px; height:18px;"></i>
          </div>
          <div>
            <div style="font-weight:800; font-size:13px; color:#1A1A18;">${templateName}</div>
            <div style="font-size:11px; color:#7A7A78; margin-top:2px;">Standardized document template for Due Diligence submissions</div>
          </div>
        </div>
        <p style="font-size:12px; color:#4A4A48; line-height:1.5;">Founders can download this pre-formatted reference document when completing their folder submission package.</p>
        <div class="vdr-modal-footer">
          <button class="vdr-btn-outline" onclick="hideVDRModal()">Close</button>
          <button class="vdr-btn-primary" onclick="hideVDRModal(); downloadFile('${templateName}');">
            <i data-lucide="download" style="width:12px; height:12px;"></i> Download Template
          </button>
        </div>
      </div>
    `);
  }

  /* ── LOCAL MODAL SYSTEM ── */
  function showVDRModal(title, bodyHtml) {
    closeAllContextMenus();
    document.getElementById('vdrModalTitle').textContent = title;
    document.getElementById('vdrModalBody').innerHTML = bodyHtml;
    document.getElementById('vdrModalBackdrop').style.display = 'flex';
    if (typeof lucide !== 'undefined') lucide.createIcons();
  }
  function hideVDRModal() {
    document.getElementById('vdrModalBackdrop').style.display = 'none';
    document.getElementById('vdrModalBody').innerHTML = '';
  }
  function handleVDRBackdropClick(e) {
    if (e.target === document.getElementById('vdrModalBackdrop')) hideVDRModal();
  }
</script>
</body>
</html>
