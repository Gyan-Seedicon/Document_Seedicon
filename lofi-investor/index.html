<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seedicon — Investor Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="./css/styles.css">
<!-- Lucide Icons CDN -->
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="app-container">
  <!-- Top Header Component Slot -->
  <div id="appHeaderSlot"></div>

  <!-- Body Shell -->
  <div class="body-shell">
    <!-- Tiny Sidebar Component Slot -->
    <div id="tinySidebarSlot"></div>

    <!-- Main Navigation Sidebar Component Slot -->
    <div id="mainSidebarSlot"></div>

    <!-- MAIN WORKSPACE CONTENT AREA (DASHBOARD PAGE) -->
    <main class="main-workspace">
      <div class="content-scrollable">
        
        <!-- Section Title Indicator Bar -->
        <div class="section-indicator-bar">
          <span class="section-indicator-icon">
            <i data-lucide="layout-dashboard"></i>
          </span>
          <span class="section-indicator-divider">|</span>
          <span class="section-indicator-title" id="currentWorkspaceTitle">Dashboard</span>
        </div>

        <!-- Page Header Container (Matching Screenshot UI) -->
        <div class="page-header-container">
          <div class="page-header-top-row">
            <div class="header-titles">
              <h1 class="page-title" id="pageHeaderTitle">Investor Command Center</h1>
              <p class="page-subtitle" id="pageHeaderSub">Seedicon Venture Fund I (₹20 Cr Target) — Ecosystem Active</p>
            </div>
            
            <div class="header-action-group">
              <button class="btn btn-primary" onclick="document.getElementById('createActionsMenu').classList.toggle('show')">
                <i data-lucide="plus"></i>
                <span>+ Create action</span>
              </button>
              
              <div class="dropdown-wrap">
                <button class="btn btn-outline">
                  <span>More</span>
                  <i data-lucide="chevron-down" class="lucide-sm"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- Controls Row: Search & Filter Controls -->
          <div class="page-header-controls-row">
            <div class="inpage-search-box">
              <i data-lucide="search" class="search-icon"></i>
              <input type="text" class="inpage-search-input" placeholder="Search..."/>
            </div>
            <button class="btn-icon" title="Filter &amp; Sort">
              <i data-lucide="sliders-horizontal"></i>
            </button>
          </div>
        </div>

        <!-- Header Bottom Divider Line -->
        <div class="page-header-divider"></div>

        <!-- CLEAN EMPTY CANVAS STATE (Matching Screenshot UI) -->
        <div class="empty-canvas-box" id="mainCanvasBox">
          <div class="empty-canvas-icon">
            <i data-lucide="layout-template" class="lucide-lg"></i>
          </div>
          <h2 class="empty-canvas-title">Investor Dashboard Workspace</h2>
          <p class="empty-canvas-sub">Center workspace canvas is clear. Switch funds using the Fund Dropdown in the top navbar or click + Create action to begin!</p>
        </div>

      </div>
    </main>

  </div>
</div>

<!-- Modal Dialog Container Slot -->
<div id="modalSlot"></div>

<!-- Scripts -->
<script src="./js/components.js"></script>
<script src="./js/app.js"></script>
<script>
  // Initialize Modular Component Layout for Dashboard
  LayoutComponents.init({ activeNav: 'dashboard', activeApp: 'investor' });
</script>
</body>
</html>
