<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VDR (Data Room) — Seedicon Investor Platform</title>
  <link rel="stylesheet" href="./css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Table View Styling matching capital-calls.html data-table */
    .table-card {
      background: #FFFFFF;
      border: 1px solid var(--border-main);
      border-radius: 8px;
      overflow: hidden;
    }
    .table-toolbar {
      padding: 10px 16px;
      background: #FFFFFF;
      border-bottom: 1px solid var(--border-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .table-toolbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
    }
    .data-table th {
      text-align: left;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #8C8C88;
      padding: 7px 12px;
      border-bottom: 1px solid #EBEBEA;
      background: #FAFAFA;
    }
    .data-table td {
      padding: 7px 12px;
      font-size: 11.5px;
      color: #3A3A38;
      border-bottom: 1px solid #F3F3F1;
      vertical-align: middle;
    }
    .data-table tr:hover td { background: #FAFAFA; cursor: pointer; }
    .data-table tr:last-child td { border-bottom: none; }

    .table-footer {
      padding: 10px 16px;
      background: #FAFAFA;
      border-top: 1px solid #EBEBEA;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }
    .pager-btn {
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      background: #FFFFFF;
      border: 1px solid #DCDCDA;
      border-radius: 4px;
      color: var(--text-dark);
      cursor: pointer;
    }
    .pager-btn:hover { background: #F0F0EE; }

    /* ── Monochrome Condensed Folder Surface Grid ── */
    .vdr-folder-big-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 10px 8px;
      width: 100%;
      padding: 2px 0 16px;
    }

    .vdr-folder-big-card {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 8px 6px 7px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s ease;
    }

    .vdr-folder-big-card:hover {
      background: #EDEDE9;
    }

    .vdr-folder-card-menu-wrap {
      position: absolute;
      top: 3px;
      right: 3px;
      opacity: 0;
      transition: opacity 0.1s ease;
      z-index: 2;
    }

    .vdr-folder-big-card:hover .vdr-folder-card-menu-wrap {
      opacity: 1;
    }

    .vdr-dot-menu-btn {
      background: transparent;
      border: none;
      color: #8A8A88;
      cursor: pointer;
      padding: 3px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s ease;
    }

    .vdr-dot-menu-btn:hover {
      background: rgba(0, 0, 0, 0.08);
      color: #1A1A18;
    }

    .vdr-context-menu {
      position: absolute;
      top: 100%;
      right: 0;
      background: #FFFFFF;
      border: 1px solid #DFDEDE;
      border-radius: 7px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      min-width: 150px;
      z-index: 100;
      padding: 3px;
      display: none;
      flex-direction: column;
      gap: 1px;
    }

    .vdr-context-menu.show {
      display: flex;
    }

    .vdr-menu-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 600;
      color: #1A1A18;
      background: transparent;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
      width: 100%;
      font-family: inherit;
      transition: background 0.08s;
    }

    .vdr-menu-item:hover {
      background: #F0F0EE;
    }

    .vdr-menu-item.danger {
      color: #DC2626;
    }

    .vdr-menu-item.danger:hover {
      background: #FEF2F2;
    }

    .vdr-menu-divider {
      height: 1px;
      background: #EBEBEA;
      margin: 2px 0;
    }

    .vdr-folder-card-graphic {
      width: 66px;
      height: 52px;
      margin: 1px auto 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: transform 0.1s ease;
    }

    .vdr-folder-big-card:hover .vdr-folder-card-graphic {
      transform: translateY(-1px);
    }

    .vdr-folder-big-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.05));
    }

    .vdr-folder-card-meta {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      width: 100%;
      min-width: 0;
    }

    .vdr-folder-card-name {
      font-size: 11.5px;
      font-weight: 700;
      color: #1A1A18;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 135px;
      line-height: 1.25;
      text-align: center;
    }

    .vdr-folder-card-size {
      font-size: 10px;
      color: #8C8C88;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }

    /* Direction Pill Tabs */
    .vdr-tab-pill {
      background: transparent;
      border: none;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      color: #7A7A78;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-family: inherit;
      transition: all 0.1s;
    }
    .vdr-tab-pill:hover {
      color: #1A1A18;
    }
    .vdr-tab-pill.active {
      background: #FFFFFF;
      color: #1A1A18;
      font-weight: 700;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    /* Card View Styling */
    .vdr-card {
      background: #FFFFFF;
      border: 1px solid #DFDEDE;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.13s, box-shadow 0.13s, transform 0.1s;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .vdr-card:hover {
      border-color: #B0B0AE;
      box-shadow: 0 4px 14px rgba(0,0,0,0.07);
      transform: translateY(-1px);
    }
    .vdr-card-header {
      padding: 14px 15px 12px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .vdr-icon-wrap {
      width: 38px;
      height: 38px;
      border-radius: 6px;
      background: #F0F0EE;
      border: 1px solid #E0E0DE;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #3A3A38;
    }
    .vdr-card-name {
      font-size: 13.5px;
      font-weight: 800;
      color: #1A1A18;
      letter-spacing: -0.02em;
      line-height: 1.25;
      flex: 1;
      min-width: 0;
    }

    /* Square corner tag for industry */
    .vdr-type-tag {
      font-size: 9.5px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 0px;
      background: #F0F0EE;
      color: #3A3A38;
      border: 1px solid #DCDCDA;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .vdr-card-footer {
      padding: 8px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FAFAFA;
      border-top: 1px solid #F0F0EE;
      margin-top: auto;
    }
    .vdr-card-date {
      font-size: 10px;
      color: #9A9A96;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .vdr-card-actions {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .vdr-action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 5px;
      border: 1px solid #E0E0DE;
      background: #FFFFFF;
      cursor: pointer;
      color: #7A7A78;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }
    .vdr-action-btn:hover {
      background: #1A1A18;
      color: #FFFFFF;
      border-color: #1A1A18;
    }
    .vdr-action-btn.danger:hover {
      background: #DC2626;
      border-color: #DC2626;
      color: #FFFFFF;
    }

    /* ── Lofi Accept / Deny Decision Buttons (black & white range) ── */
    .decision-btns {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .decision-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 11px;
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-radius: 4px;
      cursor: pointer;
      font-family: Inter, sans-serif;
      transition: background 0.12s, color 0.12s, border-color 0.12s, box-shadow 0.12s;
      white-space: nowrap;
      border: 1px solid #1A1A18;
    }
    .decision-btn.accept {
      background: #1A1A18;
      color: #FFFFFF;
      border-color: #1A1A18;
    }
    .decision-btn.accept:hover {
      background: #FFFFFF;
      color: #1A1A18;
      border-color: #1A1A18;
      box-shadow: 0 2px 0 #1A1A18;
    }
    .decision-btn.deny {
      background: #FFFFFF;
      color: #1A1A18;
      border-color: #D0D0CE;
    }
    .decision-btn.deny:hover {
      background: #1A1A18;
      color: #FFFFFF;
      border-color: #1A1A18;
      box-shadow: 0 2px 0 #3A3A38;
    }

    /* ── Decision State Tag (Accepted / Denied / Pending) ── */
    .decision-state {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 9px;
      font-size: 9.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-radius: 3px;
      border: 1px solid #DCDCDA;
      white-space: nowrap;
    }
    .decision-state.accepted {
      background: #1A1A18;
      color: #FFFFFF;
      border-color: #1A1A18;
    }
    .decision-state.denied {
      background: #F5F5F3;
      color: #6A6A68;
      border-color: #DCDCDA;
    }
    .decision-state.pending {
      background: #FAFAFA;
      color: #7A7A78;
      border-color: #E0E0DE;
    }
    .decision-state .lucide {
      width: 10px;
      height: 10px;
    }

    /* Decided banner strip inside outbound cards */
    .decision-banner {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 15px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-top: 1px solid #EBEBEA;
      background: #FAFAFA;
    }
    .decision-banner.accepted {
      color: #1A1A18;
      background: #F0F0EE;
      border-color: #E0E0DE;
    }
    .decision-banner.denied {
      color: #8C8C88;
      background: #F7F7F5;
      border-color: #EBEBEA;
    }
    .decision-banner .lucide {
      width: 11px;
      height: 11px;
    }

    /* Local modal styles */
    .vdr-modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.35);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeInBd 0.12s ease;
    }
    @keyframes fadeInBd { from { opacity:0; } to { opacity:1; } }
    .vdr-modal-box {
      background: #FFFFFF;
      border-radius: 8px;
      border: 1px solid #E0E0DE;
      width: 460px;
      max-width: 94vw;
      padding: 0;
      box-shadow: 0 16px 40px rgba(0,0,0,0.14);
      animation: slideUpMd 0.14s ease;
    }
    @keyframes slideUpMd { from { transform: translateY(12px); opacity:0; } to { transform: translateY(0); opacity:1; } }
    .vdr-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #EBEBEA;
      padding: 14px 18px;
    }
    .vdr-modal-title { font-size: 14px; font-weight: 800; color: #1A1A18; }
    .vdr-modal-close {
      background: transparent; border: none; cursor: pointer; color: #7A7A78;
      display: flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 5px;
      transition: background 0.1s; font-size: 18px; line-height: 1;
    }
    .vdr-modal-close:hover { background: #F0F0EE; color: #1A1A18; }
    .vdr-modal-body { padding: 18px 18px 0; }
    .vdr-modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 14px 18px;
      border-top: 1px solid #EBEBEA;
      margin-top: 16px;
    }
    .vdr-modal-footer-split {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 14px 18px;
      border-top: 1px solid #EBEBEA;
      margin-top: 16px;
    }

    .field-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
    .field-label { font-size: 10.5px; font-weight: 700; color: #4A4A48; text-transform: uppercase; letter-spacing: 0.05em; }
    .field-input {
      border: 1px solid #E0E0DE; border-radius: 6px; padding: 8px 10px;
      font-size: 12px; font-family: Inter, sans-serif; color: #1A1A18;
      background: #FAFAFA; outline: none; transition: border-color 0.12s;
      width: 100%; box-sizing: border-box;
    }
    .field-input:focus { border-color: #1A1A18; background: #FFFFFF; }
    .field-select { cursor: pointer; }

    .btn-modal-cancel {
      font-size: 11.5px; font-weight: 700; border: 1px solid #DCDCDA; border-radius: 6px;
      padding: 7px 14px; cursor: pointer; background: #F5F5F3; color: #3A3A38;
      font-family: Inter, sans-serif; transition: background 0.1s;
    }
    .btn-modal-cancel:hover { background: #EBEBEA; }
    .btn-modal-primary {
      font-size: 11.5px; font-weight: 700; border: 1px solid #1A1A18; border-radius: 6px;
      padding: 7px 14px; cursor: pointer; background: #1A1A18; color: #FFFFFF;
      font-family: Inter, sans-serif; transition: background 0.1s;
    }
    .btn-modal-primary:hover { background: #2A2A28; }
    .btn-modal-danger {
      font-size: 11.5px; font-weight: 700; border: 1px solid #FECACA; border-radius: 6px;
      padding: 7px 14px; cursor: pointer; background: #FEF2F2; color: #DC2626;
      font-family: Inter, sans-serif; transition: background 0.1s;
    }
    .btn-modal-danger:hover { background: #FEE2E2; }

    /* ── New Data Room Option Choice Cards (Light Mode) ── */
    .vdr-choice-card {
      display: flex;
      align-items: flex-start;
      gap: 13px;
      padding: 12px 14px;
      border: 1.5px solid #E0E0DE;
      border-radius: 8px;
      background: #FFFFFF;
      cursor: pointer;
      transition: all 0.12s ease;
      margin-bottom: 10px;
      user-select: none;
    }
    .vdr-choice-card:hover {
      border-color: #B0B0AE;
      background: #FAFAFA;
    }
    .vdr-choice-card.selected {
      border-color: #1A1A18;
      background: #FAFAF9;
      box-shadow: 0 0 0 1px #1A1A18;
    }
    .vdr-choice-icon {
      color: #3A3A38;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .vdr-choice-card.selected .vdr-choice-icon {
      color: #1A1A18;
    }
    .vdr-choice-title {
      font-size: 13px;
      font-weight: 800;
      color: #1A1A18;
      line-height: 1.25;
    }
    .vdr-choice-desc {
      font-size: 11.5px;
      color: #6A6A68;
      line-height: 1.4;
      margin-top: 3px;
    }

    /* Empty state */
    .vdr-empty-state {
      background: #FFFFFF;
      border: 1px dashed #DCDCDA;
      border-radius: 8px;
      padding: 52px 24px;
      text-align: center;
    }
  </style>
</head>
<body>
<div class="app-container">
  <div id="appHeaderSlot"></div>
  <div class="main-workspace" style="display:flex; flex-direction:row;">
    <div id="tinySidebarSlot"></div>
    <div id="mainSidebarSlot"></div>

    <main class="content-scrollable" style="padding:0; display:flex; flex-direction:column; background:#F5F5F3;">

      <!-- PAGE HEADER BAR -->
      <header style="padding:10px 22px; background:#FFFFFF; border-bottom:1px solid #E4E4E2; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; position:sticky; top:0; z-index:10;">
        <div>
          <div style="display:flex; align-items:center; gap:8px;">
            <h1 style="font-size:16.5px; font-weight:800; color:#1A1A18; letter-spacing:-0.02em;">VDR (Data Room)</h1>
            <span id="vdrCountBadge" style="font-size:10.5px; font-weight:700; background:#F0F0EE; color:#4A4A48; border:1px solid #DCDCDA; border-radius:10px; padding:2px 8px;">4 Data Rooms</span>
          </div>
          <p style="font-size:11px; color:#8C8C88; margin-top:1px;" id="vdrDesc">
            Create and manage Virtual Data Rooms. Share structured document templates with founders securely.
          </p>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <button class="btn btn-primary" onclick="openCreateVDR()" style="font-size:12px;">
            <i data-lucide="plus" class="lucide-sm"></i>
            <span>Create Data Room</span>
          </button>
        </div>
      </header>

      <!-- SEARCH & CONTROLS STRIP -->
      <div style="padding:7px 22px; background:#FFFFFF; border-bottom:1px solid #EBEBEA; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-shrink:0;">
        <div style="display:flex; align-items:center; gap:6px; flex:1; max-width:400px; background:#F7F7F5; border:1px solid #E0E0DE; border-radius:6px; padding:5px 10px;">
          <i data-lucide="search" style="width:13px; height:13px; color:#9A9A96; flex-shrink:0;"></i>
          <input type="text" id="vdrSearch" onkeyup="filterVDR()" placeholder="Search data rooms..." style="border:none; background:transparent; outline:none; font-family:Inter,sans-serif; font-size:11.5px; width:100%; color:#1A1A18;" />
        </div>

        <div style="display:flex; align-items:center; gap:10px;">
          <!-- Compact Direction Tabs (Inbound / Outbound) -->
          <div style="display:flex; background:#F0F0EE; border:1px solid #E0E0DE; border-radius:6px; padding:2px; gap:2px;">
            <button class="vdr-tab-pill active" id="tabNavInbound" onclick="switchVDRTab('inbound')">
              <span>Inbound</span>
              <span id="tabInboundCount" style="font-size:9.5px; opacity:0.8;">(4)</span>
            </button>
            <button class="vdr-tab-pill" id="tabNavOutbound" onclick="switchVDRTab('outbound')">
              <span>Outbound</span>
              <span id="tabOutboundCount" style="font-size:9.5px; opacity:0.8;">(4)</span>
            </button>
          </div>

          <div style="display:flex; align-items:center; gap:5px; font-size:11px; color:#7A7A78;">
            <span>Sort:</span>
            <select id="vdrSort" onchange="filterVDR()" style="border:1px solid #E0E0DE; border-radius:5px; padding:3px 6px; font-size:11px; font-family:Inter,sans-serif; background:#FAFAFA; color:#1A1A18; cursor:pointer;">
              <option value="newest">Newest First</option>
              <option value="name">Name A–Z</option>
              <option value="docs">Most Documents</option>
            </select>
          </div>

          <!-- View Toggle Buttons -->
          <div style="display:flex; background:#F0F0EE; padding:2px; border-radius:6px; border:1px solid #E0E0DE; gap:1px;">
            <button id="btnViewGrid" onclick="setViewMode('grid')" title="Cards" style="display:flex; align-items:center; gap:4px; padding:3px 9px; border-radius:4px; border:1px solid #C8C8C6; background:#FFFFFF; font-size:11px; font-weight:700; color:#1A1A18; cursor:pointer; font-family:Inter,sans-serif;">
              <i data-lucide="layout-grid" style="width:12px; height:12px;"></i>
              <span>Cards</span>
            </button>
            <button id="btnViewTable" onclick="setViewMode('table')" title="Table" style="display:flex; align-items:center; gap:4px; padding:3px 9px; border-radius:4px; border:none; background:transparent; font-size:11px; font-weight:500; color:#7A7A78; cursor:pointer; font-family:Inter,sans-serif;">
              <i data-lucide="list" style="width:12px; height:12px;"></i>
              <span>Table</span>
            </button>
          </div>
        </div>
      </div>

      <!-- MAIN CONTENT WORKSPACE -->
      <div style="padding:14px 22px; flex:1;">
        <div id="vdrContainer"></div>
      </div>

    </main>
  </div>
</div>

<!-- VDR Local Modal -->
<div id="vdrModalBackdrop" style="display:none;" class="vdr-modal-backdrop" onclick="handleBackdropClick(event)">
  <div class="vdr-modal-box" onclick="event.stopPropagation()">
    <div class="vdr-modal-header">
      <span class="vdr-modal-title" id="vdrModalTitle">Modal</span>

    },
    {
      id: 'vdr3',

      docs: 18,
      sharedStartups: 3,

      createdDate: 'Feb 18, 2026',
      lastUpdated: '5 days ago',
    },
    {
      id: 'vdr4',
      name: 'Financial Health Review',
      industry: 'FinTech',
      desc: 'Financial review and auditing document checklist for FinTech startups.',
      docs: 14,
      sharedStartups: 0,
      sharedNames: [],
      createdDate: 'Mar 1, 2026',
      lastUpdated: 'Today',
    },
  ];

  let viewMode = 'grid';

  // ── OUTBOUND: Data room access requests received from startups (external source) ──
  let OUTBOUND_REQUESTS = [
    {
      id: 'ob1',
      startup: 'Alpha Health',
      logo: 'AH',
      industry: 'Healthcare',
      vdrName: 'Seed Round Due Diligence',
      desc: 'Requesting access to the standard Seed round DD data room shared via the public link.',
      docs: 24,
      requestedBy: 'Dr. Sarah Chen',
      requestedDate: 'Feb 26, 2026',
      status: 'pending'
    },
    {
      id: 'ob2',
      startup: 'SkyTrack Mobility',
      logo: 'ST',

      vdrName: 'Series A Package',
      desc: 'Startup reached out to review the Series A due diligence package before their round closes.',
      docs: 31,
      requestedBy: 'Helen Cruz',
      requestedDate: 'Feb 24, 2026',
      status: 'pending'
    },
    {
      id: 'ob3',
      startup: 'NovaPay',
      logo: 'NV',
      industry: 'FinTech',
      vdrName: 'Compliance Checklist',
      desc: 'Requesting the regulatory & legal compliance verification document set for their seed round.',
      docs: 18,
      requestedBy: 'Raj Anand',
      requestedDate: 'Feb 22, 2026',
      status: 'pending'
    },
    {
      id: 'ob4',
      startup: 'BioCore Diagnostics',
      logo: 'BC',
      industry: 'BioTech',
      vdrName: 'Financial Health Review',
      desc: 'BioCore founders requested financial review templates ahead of their Series A diligence.',
      docs: 14,
      requestedBy: 'James Whitfield',
      requestedDate: 'Feb 20, 2026',
      status: 'pending'
    }
  ];

  document.addEventListener('DOMContentLoaded', () => { filterVDR(); });

  /* ── LOCAL MODAL SYSTEM ── */
  function showVDRModal(title, bodyHtml) {
    document.getElementById('vdrModalTitle').textContent = title;
    document.getElementById('vdrModalBody').innerHTML = bodyHtml;
    document.getElementById('vdrModalBackdrop').style.display = 'flex';
    if (typeof lucide !== 'undefined') lucide.createIcons();
  }
  function hideVDRModal() {
    document.getElementById('vdrModalBackdrop').style.display = 'none';
    document.getElementById('vdrModalBody').innerHTML = '';
    _pendingDeleteId = null;
  }
  function handleBackdropClick(e) {
    if (e.target === document.getElementById('vdrModalBackdrop')) hideVDRModal();
  }

  /* ── VIEW TOGGLE ── */
  function setViewMode(mode) {
    viewMode = mode;
    const gridBtn = document.getElementById('btnViewGrid');
    const tableBtn = document.getElementById('btnViewTable');
    if (gridBtn) {
      gridBtn.style.cssText = mode === 'grid'
        ? 'display:flex;align-items:center;gap:3px;padding:3px 7px;border-radius:4px;border:1px solid #C8C8C6;background:#FFFFFF;font-size:10.5px;font-weight:700;color:#1A1A18;cursor:pointer;font-family:Inter,sans-serif;'
        : 'display:flex;align-items:center;gap:3px;padding:3px 7px;border-radius:4px;border:none;background:transparent;font-size:10.5px;font-weight:500;color:#7A7A78;cursor:pointer;font-family:Inter,sans-serif;';
    }
    if (tableBtn) {
      tableBtn.style.cssText = mode === 'table'
        ? 'display:flex;align-items:center;gap:3px;padding:3px 7px;border-radius:4px;border:1px solid #C8C8C6;background:#FFFFFF;font-size:10.5px;font-weight:700;color:#1A1A18;cursor:pointer;font-family:Inter,sans-serif;'
        : 'display:flex;align-items:center;gap:3px;padding:3px 7px;border-radius:4px;border:none;background:transparent;font-size:10.5px;font-weight:500;color:#7A7A78;cursor:pointer;font-family:Inter,sans-serif;';
    }
    filterVDR();
  }

  /* ── DIRECTION TAB (INBOUND / OUTBOUND) ── */
  let vdrTab = 'inbound';
  function switchVDRTab(tab) {
    vdrTab = tab;
    document.getElementById('tabNavInbound').classList.toggle('active', tab === 'inbound');
    document.getElementById('tabNavOutbound').classList.toggle('active', tab === 'outbound');

    const inCount = document.getElementById('tabInboundCount');
    const outCount = document.getElementById('tabOutboundCount');
    if (inCount) inCount.textContent = `(${VDRs.length})`;
    if (outCount) outCount.textContent = `(${OUTBOUND_REQUESTS.length})`;

    const desc = document.getElementById('vdrDesc');
    if (desc) {
      desc.innerHTML = tab === 'inbound'
        ? 'Virtual data rooms <strong style="color:#4A4A48;">you share</strong> with startups via secure invite links.'
        : 'Data room access <strong style="color:#4A4A48;">requests received from startups</strong>. Review, accept or deny each request.';
    }
    filterVDR();
  }

  /* ── FILTER + SORT ── */
  function filterVDR() {
    const q = (document.getElementById('vdrSearch')?.value || '').toLowerCase();
    const sort = document.getElementById('vdrSort')?.value || 'newest';

    const source = vdrTab === 'outbound' ? OUTBOUND_REQUESTS : VDRs;
    let list = source.filter(v => {
      const hay = vTabSearchText(v);
      if (q && !hay.toLowerCase().includes(q)) return false;
      return true;
    });

    if (sort === 'name')   list.sort((a,b) => vTabSortName(a).localeCompare(vTabSortName(b)));
    if (sort === 'docs')   list.sort((a,b) => (b.docs || 0) - (a.docs || 0));

    renderVDR(list);
  }

  function vTabSearchText(v) {
    return `${v.name || v.startup || ''} ${v.industry || ''} ${v.vdrName || ''} ${v.requestedBy || ''}`;
  }
  function vTabSortName(v) {
    return v.name || v.startup || '';
  }

  function getIconByIndustry(ind) {
    return INDUSTRY_TYPES[ind]?.icon || 'folder-lock';
  }

  /* ── RENDER ── */
  function renderVDR(list) {
    const container = document.getElementById('vdrContainer');
    const badge = document.getElementById('vdrCountBadge');
    const isOut = vdrTab === 'outbound';
    if (badge) badge.textContent = isOut
      ? `${list.length} Request${list.length !== 1 ? 's' : ''}`
      : `${list.length} Data Room${list.length !== 1 ? 's' : ''}`;
    if (!container) return;

    if (!list.length) {
      container.innerHTML = `
        <div class="vdr-empty-state">
          <i data-lucide="folder-lock" style="width:30px; height:30px; color:#B0B0AE; margin-bottom:10px;"></i>
          <div style="font-size:13.5px; font-weight:800; color:#2A2A28; margin-bottom:4px;">${isOut ? 'No Incoming Requests' : 'No Data Rooms Found'}</div>
          <p style="font-size:11.5px; color:#8C8C88; margin-bottom:14px;">${isOut ? 'No data room access requests from startups yet.' : 'No data rooms match your search. Try a different keyword or create one.'}</p>
          ${isOut ? '' : `<button class="btn btn-primary" onclick="openCreateVDR()" style="font-size:12px;">
            <i data-lucide="plus" class="lucide-sm"></i> Create Data Room
          </button>`}
        </div>`;
      if (typeof lucide !== 'undefined') lucide.createIcons();
      return;
    }

    if (viewMode === 'grid') {
      container.innerHTML = `
        <div class="${isOut ? '' : 'vdr-folder-big-grid'}" ${isOut ? 'style="display:grid; grid-template-columns:repeat(3, 1fr); gap:12px;"' : ''}>
          ${list.map(v => {
            if (isOut) {
              const stateTag = v.status === 'accepted'
                ? `<span class="decision-state accepted"><i data-lucide="check-circle-2" style="width:10px;height:10px;"></i> Accepted</span>`
                : v.status === 'denied'
                  ? `<span class="decision-state denied"><i data-lucide="x-circle" style="width:10px;height:10px;"></i> Denied</span>`
                  : `<span class="decision-state pending"><i data-lucide="clock" style="width:10px;height:10px;"></i> Pending</span>`;
              return `
                <div class="vdr-card">
                  <div class="vdr-card-header">
                    <div style="display:flex; align-items:flex-start; gap:10px; flex:1; min-width:0;">
                      <div class="vdr-icon-wrap">
                        <i data-lucide="${getIconByIndustry(v.industry)}" style="width:17px; height:17px;"></i>
                      </div>
                      <div style="flex:1; min-width:0;">
                        <div class="vdr-card-name">${v.startup}</div>
                        <div style="display:flex; align-items:center; gap:8px; margin-top:7px; font-size:11px; color:#5A5A58; font-weight:600; flex-wrap:nowrap; overflow:hidden;">
                          <span style="display:inline-flex; align-items:center; gap:4px; white-space:nowrap;"><i data-lucide="folder-lock" style="width:11px; height:11px; color:#8A8A88; flex-shrink:0;"></i> ${v.vdrName}</span>
                        </div>
                      </div>
                    </div>
                    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:5px;">
                      <span class="vdr-type-tag">${(v.industry || 'GENERAL DD').toUpperCase()}</span>
                      ${stateTag}
                    </div>
                  </div>
                  <div style="padding:10px 15px; font-size:11.5px; color:#5A5A58; line-height:1.5; border-bottom:1px solid #F0F0EE;">
                    ${v.desc}
                    <div style="display:flex; align-items:center; gap:5px; margin-top:8px; font-size:10.5px; color:#9A9A96;">
                      <i data-lucide="user" style="width:10px; height:10px;"></i> ${v.requestedBy} · ${v.requestedDate}
                    </div>
                  </div>
                  ${v.status === 'pending' ? `
                    <div class="vdr-card-footer" onclick="event.stopPropagation()">
                      <div class="vdr-card-date">
                        <i data-lucide="file-text" style="width:10px; height:10px;"></i>
                        ${v.docs} Docs requested
                      </div>
                      <div class="decision-btns">
                        <button class="decision-btn accept" onclick="decideRequest('${v.id}','accepted')">
                          <i data-lucide="check" style="width:10px; height:10px;"></i> Accept
                        </button>
                        <button class="decision-btn deny" onclick="decideRequest('${v.id}','denied')">
                          <i data-lucide="x" style="width:10px; height:10px;"></i> Deny
                        </button>
                      </div>
                    </div>
                  ` : `
                    <div class="decision-banner ${v.status === 'accepted' ? 'accepted' : 'denied'}">
                      <i data-lucide="${v.status === 'accepted' ? 'unlock' : 'lock'}" style="width:11px;height:11px;"></i>
                      ${v.status === 'accepted'
                        ? `Access granted — data room unlocked for ${v.startup}`
                        : `Request declined — ${v.startup} not granted access`}
                    </div>
                  `}
                </div>
              `;
            }
            const sharedText = v.sharedStartups > 0
              ? `${v.sharedStartups} shared`
              : 'Not shared';
            return `
              <div class="vdr-folder-big-card" id="vdr-card-${v.id}" onclick="navigateToDetail('${v.id}')">
                
                <!-- Three dots options menu -->
                <div class="vdr-folder-card-menu-wrap" onclick="event.stopPropagation();">
                  <button class="vdr-dot-menu-btn" onclick="toggleVdrMenu('${v.id}', event)" title="Options">
                    <i data-lucide="more-vertical" style="width:13px; height:13px;"></i>
                  </button>

                  <div class="vdr-context-menu" id="vdr-menu-${v.id}">
                    <button class="vdr-menu-item" onclick="openShareVDR('${v.id}')">
                      <i data-lucide="send" style="width:13px; height:13px;"></i>
                      <span>Share with Startup</span>
                    </button>
                    <button class="vdr-menu-item" onclick="openEditVDR('${v.id}')">
                      <i data-lucide="pencil" style="width:13px; height:13px;"></i>
                      <span>Edit Data Room</span>
                    </button>
                    <button class="vdr-menu-item" onclick="copyVdrLink('${v.id}')">
                      <i data-lucide="link" style="width:13px; height:13px;"></i>
                      <span>Copy Link</span>
                    </button>
                    <div class="vdr-menu-divider"></div>
                    <button class="vdr-menu-item danger" onclick="promptDeleteVDR('${v.id}')">

                      <span>Delete Data Room</span>

                    <line x1="33" y1="18" x2="46" y2="18" stroke="#E5E5E0" stroke-width="1.2" stroke-linecap="round"/>
                    
                    <!-- Back neutral folder tab -->
                    <path d="M8 17C8 12.5817 11.5817 9 16 9H34C36.2 9 38.3 10.1 39.5 11.9L42.5 16.1C43.7 17.9 45.8 19 48 19H80C84.4183 19 88 22.5817 88 27V60C88 64.4183 84.4183 68 80 68H16C11.5817 68 8 64.4183 8 60V17Z" fill="#D4D4CE"/>
                    
                    <!-- Front neutral folder body -->
                    <path d="M8 25C8 20.5817 11.5817 17 16 17H80C84.4183 17 88 20.5817 88 25V60C88 64.4183 84.4183 68 80 68H16C11.5817 68 8 64.4183 8 60V25Z" fill="#EAEAE7" stroke="#D4D4CE" stroke-width="1"/>
                    
                    <!-- Front top lip highlight line -->
                    <line x1="16" y1="18" x2="80" y2="18" stroke="#F5F5F3" stroke-width="1.5" stroke-linecap="round"/>
                    
                    <!-- Subtle minimal monochrome lock emblem -->
                    <path d="M48 37C45.7909 37 44 38.7909 44 41V43H42C40.8954 43 40 43.8954 40 45V51C40 52.1046 40.8954 53 42 53H54C55.1046 53 56 52.1046 56 51V45C56 43.8954 55.1046 43 54 43H52V41C52 38.7909 50.2091 37 48 37ZM46 41C46 39.8954 46.8954 39 48 39C49.1046 39 50 39.8954 50 41V43H46V41Z" fill="#141413" fill-opacity="0.3"/>
                  </svg>
                </div>

                <!-- Single-Line Folder Name & Size/Docs -->
                <div class="vdr-folder-card-meta">
                  <span class="vdr-folder-card-name" title="${v.name}">${v.name}</span>
                  <span class="vdr-folder-card-size">${v.docs} Docs · ${sharedText}</span>
                </div>

              </div>
            `;
          }).join('')}
        </div>
      `;
    } else {
      // TABLE VIEW
      container.innerHTML = `
        <div class="table-card">
          <div class="table-toolbar">
            <div class="table-toolbar-left">
              <strong style="font-size:12.5px; color:var(--text-dark);">${isOut ? 'Incoming Data Room Requests' : 'Data Room Register'}</strong>
              <span class="badge-pill neutral-soft">${list.length} ${isOut ? 'Request' + (list.length !== 1 ? 's' : '') : 'Room' + (list.length !== 1 ? 's' : '')}</span>
            </div>
          </div>
          <table class="data-table">
            <thead>
              <tr>
                ${isOut ? `
                  <th>Requesting Startup</th>
                  <th>Data Room Requested</th>
                  <th>Industry</th>
                  <th>Documents</th>
                  <th>Requested By</th>
                  <th>Requested On</th>
                  <th>Status</th>
                  <th style="text-align:right;">Actions</th>
                ` : `
                  <th>Data Room</th>
                  <th>Industry</th>
                  <th>Documents</th>
                  <th>Shared Startups</th>
                  <th>Created</th>
                  <th>Last Updated</th>
                  <th style="text-align:right;">Actions</th>
                `}
              </tr>
            </thead>
            <tbody>
              ${list.map(v => {
                if (isOut) {
                  const stateTag = v.status === 'accepted'
                    ? `<span class="decision-state accepted"><i data-lucide="check-circle-2" style="width:10px;height:10px;"></i> Accepted</span>`
                    : v.status === 'denied'
                      ? `<span class="decision-state denied"><i data-lucide="x-circle" style="width:10px;height:10px;"></i> Denied</span>`
                      : `<span class="decision-state pending"><i data-lucide="clock" style="width:10px;height:10px;"></i> Pending</span>`;
                  return `
                    <tr>
                      <td>
                        <div style="display:flex; align-items:center; gap:10px;">
                          <div style="width:30px; height:30px; border-radius:6px; background:#1A1A18; color:#FFFFFF; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:10px; flex-shrink:0;">${v.logo || ''}</div>
                          <span style="font-weight:700; color:#1A1A18;">${v.startup}</span>
                        </div>
                      </td>
                      <td><span class="vdr-type-tag">${v.vdrName.toUpperCase()}</span></td>
                      <td style="color:#5A5A58;">${v.industry}</td>
                      <td style="font-weight:700; color:#1A1A18;">${v.docs}</td>
                      <td style="color:#3A3A38;">${v.requestedBy}</td>
                      <td style="color:#8C8C88;">${v.requestedDate}</td>
                      <td>${stateTag}</td>
                      <td style="text-align:right;" onclick="event.stopPropagation()">
                        ${v.status === 'pending' ? `
                          <div class="decision-btns" style="justify-content:flex-end;">
                            <button class="decision-btn accept" onclick="decideRequest('${v.id}','accepted')">
                              <i data-lucide="check" style="width:10px; height:10px;"></i> Accept
                            </button>
                            <button class="decision-btn deny" onclick="decideRequest('${v.id}','denied')">
                              <i data-lucide="x" style="width:10px; height:10px;"></i> Deny
                            </button>
                          </div>
                        ` : `<span style="font-size:11px; color:#9A9A96;">Decision locked</span>`}
                      </td>
                    </tr>
                  `;
                }
                return `
                  <tr onclick="navigateToDetail('${v.id}')">
                    <td>
                      <div style="display:flex; align-items:center; gap:10px;">
                        <div style="width:30px; height:30px; border-radius:6px; background:#F0F0EE; border:1px solid #E0E0DE; display:flex; align-items:center; justify-content:center; color:#3A3A38; flex-shrink:0;">
                          <i data-lucide="${getIconByIndustry(v.industry)}" style="width:14px; height:14px;"></i>
                        </div>
                        <span style="font-weight:700; color:#1A1A18;">${v.name}</span>
                      </div>
                    </td>
                    <td><span class="vdr-type-tag">${(v.industry || 'General DD').toUpperCase()}</span></td>
                    <td style="font-weight:700; color:#1A1A18;">${v.docs}</td>
                    <td style="font-weight:600; color:#3A3A38;">${v.sharedStartups > 0 ? v.sharedStartups + ' startups' : '—'}</td>
                    <td style="color:#8C8C88;">${v.createdDate}</td>
                    <td style="color:#8C8C88;">${v.lastUpdated}</td>
                    <td style="text-align:right;" onclick="event.stopPropagation()">
                      <div style="display:flex; justify-content:flex-end; gap:4px;">
                        <button class="vdr-action-btn" title="Share" onclick="openShareVDR('${v.id}')">
                          <i data-lucide="send" style="width:12px; height:12px;"></i>
                        </button>
                        <button class="vdr-action-btn" title="Edit" onclick="openEditVDR('${v.id}')">
                          <i data-lucide="pencil" style="width:12px; height:12px;"></i>
                        </button>
                        <button class="vdr-action-btn danger" title="Delete" onclick="promptDeleteVDR('${v.id}')">
                          <i data-lucide="trash-2" style="width:12px; height:12px;"></i>
                        </button>
                      </div>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
          <div class="table-footer">
            <span>${isOut ? 'Inbound data room requests from startups' : 'Data Room Register · Templates created for founder due diligence'}</span>
            <span style="font-size:11px; color:#9A9A96;">${list.length} total</span>
          </div>
        </div>
      `;
    }

    if (typeof lucide !== 'undefined') lucide.createIcons();
  }

  function decideRequest(id, decision) {
    const r = OUTBOUND_REQUESTS.find(x => x.id === id);
    if (!r) return;
    r.status = decision;
    filterVDR();
    if (window.showToast) window.showToast(decision === 'accepted'
      ? `Access granted to ${r.startup} for "${r.vdrName}"`
      : `Request from ${r.startup} for "${r.vdrName}" denied`);
  }

  /* ── 3-DOTS CONTEXT MENU & COPY LINK ── */
  function toggleVdrMenu(id, e) {
    if (e) e.stopPropagation();
    const menu = document.getElementById(`vdr-menu-${id}`);
    const isShowing = menu && menu.classList.contains('show');
    closeAllVdrMenus();
    if (menu && !isShowing) {
      menu.classList.add('show');
    }
  }

  function closeAllVdrMenus() {
    document.querySelectorAll('.vdr-context-menu.show').forEach(m => m.classList.remove('show'));
  }

  function copyVdrLink(id) {
    closeAllVdrMenus();
    const vdr = VDRs.find(v => v.id === id);
    const link = `${window.location.origin}/vdr-detail.html?id=${id}`;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).catch(() => {});
    }
    if (window.showToast) window.showToast(`Invite link for "${vdr ? vdr.name : 'Data Room'}" copied!`, 'success');
  }

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.vdr-folder-card-menu-wrap')) {
      closeAllVdrMenus();
    }
  });

  /* ── NAVIGATION ── */
  function navigateToDetail(id) {
    window.location.href = `./vdr-detail.html?id=${id}`;
  }

  /* ── SHARE VDR MODAL ── */
  function openShareVDR(id) {
    closeAllVdrMenus();
    const vdr = VDRs.find(v => v.id === id);
    if (!vdr) return;

    showVDRModal('Share Data Room', `
      <p style="font-size:11.5px; color:#6A6A68; margin-bottom:14px;">Sharing <strong>${vdr.name}</strong> will send a secure invite link to the founder.</p>
      <div class="field-group">
        <div class="field-label">Select Startup</div>
        <select id="shareStartupSelect" class="field-input field-select">
          <option value="">Choose a startup...</option>
          <option>Alpha Health</option>
          <option>Apex AI</option>
          <option>FinFlow Tech</option>
          <option>LogiChain Labs</option>
          <option>EcoPulse Energy</option>
          <option>NeuroPulse Health</option>
        </select>
      </div>
      <div class="field-group">
        <div class="field-label">Primary Contact Email</div>
        <input id="shareEmail" class="field-input" placeholder="founder@startup.com" type="email" />
      </div>
      <div class="vdr-modal-footer">
        <button class="btn-modal-cancel" onclick="hideVDRModal()">Cancel</button>
        <button class="btn-modal-primary" onclick="confirmShare('${id}')">
          <i data-lucide="send" style="width:12px; height:12px; display:inline;"></i> Send Invite
        </button>
      </div>
    `);
  }

  function confirmShare(id) {
    const startup = document.getElementById('shareStartupSelect')?.value;
    if (!startup) {
      if (window.showToast) window.showToast('Please select a startup to share with.', 'alert-circle');
      return;
    }
    const vdr = VDRs.find(v => v.id === id);
    if (vdr) { vdr.sharedStartups += 1; }
    hideVDRModal();
    filterVDR();
    if (window.showToast) window.showToast(`Data room shared with ${startup}!`);
  }

  /* ── EDIT VDR MODAL ── */
  function openEditVDR(id) {
    closeAllVdrMenus();
    const vdr = VDRs.find(v => v.id === id);
    if (!vdr) return;

    showVDRModal('Edit Data Room', `
      <div class="field-group">
        <div class="field-label">Room Name</div>
        <input id="editVdrName" class="field-input" value="${vdr.name}" placeholder="Room name..." />
      </div>
      <div class="field-group">
        <div class="field-label">Industry / Sector</div>
        <select id="editVdrIndustry" class="field-input field-select">
          ${Object.keys(INDUSTRY_TYPES).map(ind => `<option value="${ind}" ${vdr.industry === ind ? 'selected' : ''}>${ind}</option>`).join('')}
        </select>
      </div>
      <div class="field-group">
        <div class="field-label">Description (Optional)</div>
        <textarea id="editVdrDesc" class="field-input" rows="2" placeholder="Brief internal description...">${vdr.desc || ''}</textarea>
      </div>
      <div class="vdr-modal-footer-split">
        <button class="btn-modal-danger" onclick="promptDeleteVDR('${id}', true)">Delete Room</button>
        <div style="display:flex; gap:8px;">
          <button class="btn-modal-cancel" onclick="hideVDRModal()">Cancel</button>
          <button class="btn-modal-primary" onclick="saveEditVDR('${id}')">Save Changes</button>
        </div>
      </div>
    `);
  }

  function saveEditVDR(id) {
    const vdr = VDRs.find(v => v.id === id);
    if (!vdr) return;
    const name = document.getElementById('editVdrName')?.value?.trim();
    if (!name) {
      if (window.showToast) window.showToast('Room name cannot be empty.', 'alert-circle');
      return;
    }
    vdr.name = name;
    vdr.industry = document.getElementById('editVdrIndustry')?.value || vdr.industry;
    vdr.desc = document.getElementById('editVdrDesc')?.value || '';
    hideVDRModal();
    filterVDR();
    if (window.showToast) window.showToast(`Data room "${vdr.name}" updated`);
  }

  /* ── DELETE VDR MODAL ── */
  function promptDeleteVDR(id, fromEdit = false) {
    closeAllVdrMenus();
    const vdr = VDRs.find(v => v.id === id);
    if (!vdr) return;
    _pendingDeleteId = id;

    showVDRModal('Delete Data Room', `
      <div style="text-align:center; padding:8px 0 4px;">
        <div style="width:44px; height:44px; border-radius:50%; background:#FEF2F2; border:1px solid #FECACA; display:flex; align-items:center; justify-content:center; margin:0 auto 12px;">
          <i data-lucide="trash-2" style="width:20px; height:20px; color:#DC2626;"></i>
        </div>
        <div style="font-size:13px; font-weight:800; color:#1A1A18; margin-bottom:6px;">Delete "${vdr.name}"?</div>
        <p style="font-size:11.5px; color:#6A6A68; line-height:1.5;">
          This will permanently remove the data room and all its document structure. This action cannot be undone.
        </p>
      </div>
      <div class="vdr-modal-footer">
        <button class="btn-modal-cancel" onclick="${fromEdit ? `openEditVDR('${id}')` : 'hideVDRModal()'}">Cancel</button>
        <button class="btn-modal-danger" onclick="confirmDeleteVDR()">Yes, Delete Room</button>
      </div>
    `);
  }

  function confirmDeleteVDR() {
    const id = _pendingDeleteId;
    const vdr = VDRs.find(v => v.id === id);
    const name = vdr?.name || 'Data room';
    VDRs = VDRs.filter(v => v.id !== id);
    hideVDRModal();
    filterVDR();
    if (window.showToast) window.showToast(`"${name}" deleted`);
  }

  /* ── CREATE VDR MODAL (MATCHING NEW DATA ROOM UI) ── */
  let selectedVdrType = 'blank';

  function selectVdrType(type) {
    selectedVdrType = type;
    document.querySelectorAll('.vdr-choice-card').forEach(el => {
      el.classList.toggle('selected', el.dataset.type === type);
    });
  }

  function openCreateVDR() {
    selectedVdrType = 'blank';
    showVDRModal('New Data Room', `
      <div style="padding: 4px 0 16px;">
        <div style="margin-bottom: 14px;">
          <label style="display:block; font-size: 12px; font-weight: 700; color: #1A1A18; margin-bottom: 6px;">Name</label>
          <input id="newVdrName" class="field-input" placeholder="" style="padding: 9px 12px; font-size: 12.5px; border-radius: 6px; border: 1.5px solid #DCDCDA; background: #FFFFFF;" />
        </div>

        <div class="vdr-choice-card selected" data-type="blank" onclick="selectVdrType('blank')">
          <div class="vdr-choice-icon">
            <i data-lucide="folder" style="width: 22px; height: 22px;"></i>
          </div>
          <div style="flex: 1; min-width: 0;">
            <div class="vdr-choice-title">Blank Data Room</div>
            <div class="vdr-choice-desc">An empty Data Room for you to create folders, upload files, and include Seedicon assets.</div>
          </div>
        </div>

        <div class="vdr-choice-card" data-type="template" onclick="selectVdrType('template')">
          <div class="vdr-choice-icon">
            <i data-lucide="file-check" style="width: 22px; height: 22px;"></i>
          </div>
          <div style="flex: 1; min-width: 0;">
            <div class="vdr-choice-title">Data Room template</div>
            <div class="vdr-choice-desc">A customizable template based on best practices from founders using Seedicon.</div>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 8px; margin-top: 20px;">
          <button class="btn-modal-primary" onclick="createVDR()" style="padding: 8px 18px; border-radius: 6px; font-size: 12px; font-weight: 700; background: #1A1A18; color: #FFFFFF; border: 1px solid #1A1A18;">Create</button>
          <button class="btn-modal-cancel" onclick="hideVDRModal()" style="padding: 8px 16px; border-radius: 6px; font-size: 12px; font-weight: 600; background: #FFFFFF; color: #1A1A18; border: 1px solid #DCDCDA;">Cancel</button>
        </div>
      </div>
    `);
    // Auto-focus name field
    setTimeout(() => document.getElementById('newVdrName')?.focus(), 80);
  }

  function createVDR() {
    const name = document.getElementById('newVdrName')?.value?.trim();
    if (!name) {
      if (window.showToast) window.showToast('Please enter a data room name.', 'alert-circle');
      document.getElementById('newVdrName')?.focus();
      return;
    }
    const newId = 'vdr_' + Date.now();
    const isTemplate = selectedVdrType === 'template';

    const newVdrData = {
      id: newId,
      name,
      folders: [
        {
          id: 'general',
          title: 'General',
          docs: isTemplate ? [
            { id: 'doc1', name: 'crusource_prd', template: false, size: '29.46 KB', type: '.html', date: 'August 21, 2026' }
          ] : []
        }
      ],
      coverLetter: "Welcome to our Virtual Data Room.\n\nPlease review the requested checklist and upload the corresponding documents for each folder.",
      sharedStartups: []
    };

    try {
      localStorage.setItem('vdr_' + newId, JSON.stringify(newVdrData));
    } catch(e) {}

    hideVDRModal();
    window.location.href = `./vdr-detail.html?id=${newId}&name=${encodeURIComponent(name)}`;
  }
</script>
</body>
</html>
