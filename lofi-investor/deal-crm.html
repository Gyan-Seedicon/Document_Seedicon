<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Potential Startups — Seedicon Investor Platform</title>
  <link rel="stylesheet" href="./css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* ─── Kanban Board Layout ─── */
    .kanban-wrapper {
      display: flex;
      gap: 0;
      height: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 16px 20px 20px;
      align-items: flex-start;
    }
    .kanban-col {
      display: flex;
      flex-direction: column;
      min-width: 240px;
      max-width: 240px;
      background: #F4F4F2;
      border-radius: 8px;
      border: 1px solid var(--border-main);
      flex-shrink: 0;
      margin-right: 10px;
      overflow: hidden;
      max-height: calc(100vh - 110px);
    }
    .kanban-col-header {
      padding: 10px 12px 9px;
      border-bottom: 1px solid var(--border-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FFFFFF;
      flex-shrink: 0;
    }
    .col-title-row {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }
    .col-stage-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .col-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.01em;
    }
    .col-count {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      background: var(--bg-muted);
      border: 1px solid var(--border-main);
      border-radius: 10px;
      padding: 1px 6px;
      flex-shrink: 0;
    }
    .col-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .col-icon-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 3px;
      border-radius: 4px;
      color: var(--text-muted);
      transition: background 0.1s, color 0.1s;
      display: flex;
      align-items: center;
    }
    .col-icon-btn:hover {
      background: var(--bg-muted);
      color: var(--text-dark);
    }
    .col-sub {
      font-size: 10px;
      color: var(--text-muted);
      padding: 5px 12px 6px;
      border-bottom: 1px solid var(--border-faint);
      background: #FAFAFA;
      line-height: 1.35;
      flex-shrink: 0;
    }
    .kanban-cards {
      flex: 1;
      overflow-y: auto;
      padding: 8px 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .kanban-add-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 7px 12px;
      font-size: 11px;
      font-weight: 600;
      color: #9A9A96;
      cursor: pointer;
      background: transparent;
      border: none;
      border-top: 1px solid #F0F0EE;
      width: 100%;
      text-align: left;
      transition: background 0.1s, color 0.1s;
      flex-shrink: 0;
      font-family: Inter, sans-serif;
    }
    .kanban-add-btn:hover {
      background: #EFEFED;
      color: #1A1A18;
    }

    /* ─── Deal Cards ─── */
    .deal-card {
      background: #FFFFFF;
      border: 1px solid #DFDEDE;
      border-radius: 6px;
      cursor: pointer;
      transition: box-shadow 0.12s, border-color 0.12s, transform 0.1s;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .deal-card:hover {
      border-color: #B0B0AE;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
      transform: translateY(-1px);
    }
    .deal-card-inner {
      padding: 9px 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .deal-card-top {
      display: flex;
      align-items: flex-start;
      gap: 7px;
    }
    .deal-card-logo {
      width: 26px;
      height: 26px;
      border-radius: 5px;
      background: #F0F0EE;
      color: #3A3A38;
      border: 1px solid #E0E0DE;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 9.5px;
      flex-shrink: 0;
      letter-spacing: -0.02em;
    }
    .deal-card-name {
      font-size: 12px;
      font-weight: 800;
      color: #1A1A18;
      letter-spacing: -0.01em;
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }
    .deal-card-badges {
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
      margin-top: 2px;
    }
    .deal-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
    }
    .deal-badge-stage {
      background: #EAEAE8;
      color: #2A2A28;
      border: 1px solid #D0D0CE;
    }
    .deal-badge-sector {
      background: #F4F4F2;
      color: #5A5A58;
      border: 1px solid #E4E4E2;
    }
    .deal-card-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid #EBEBEA;
      border-radius: 4px;
      overflow: hidden;
    }
    .deal-metric-item {
      display: flex;
      flex-direction: column;
      gap: 1px;
      padding: 5px 8px;
      background: #FAFAFA;
      border-right: 1px solid #EBEBEA;
    }
    .deal-metric-item:last-child { border-right: none; }
    .deal-metric-lbl {
      font-size: 8px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #ABABAB;
    }
    .deal-metric-val {
      font-size: 11px;
      font-weight: 800;
      color: #1A1A18;
      letter-spacing: -0.01em;
    }
    .deal-card-footer {
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #F7F7F5;
      border-top: 1px solid #EBEBEA;
      font-size: 9.5px;
      color: #9A9A96;
    }
    .deal-assignee {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .deal-avatar-sm {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #3A3A38;
      color: #FFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 7px;
      font-weight: 800;
    }

    /* ─── Add Stage Column Button ─── */
    .add-stage-col {
      min-width: 200px;
      max-width: 200px;
      background: transparent;
      border: 1.5px dashed #CACAC8;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 20px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.12s, border-color 0.12s;
      margin-right: 10px;
    }
    .add-stage-col:hover {
      background: #F5F5F3;
      border-color: #1A1A18;
    }
    .add-stage-col span {
      font-size: 11.5px;
      font-weight: 700;
      color: #9A9A96;
    }

    /* ─── Edit Column Modal ─── */
    .edit-col-modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 300;
      display: flex; align-items: center; justify-content: center;
    }
    .edit-col-modal {
      background: #FFFFFF; border-radius: 8px; border: 1px solid #E0E0DE;
      width: 380px; padding: 20px; box-shadow: 0 12px 30px rgba(0,0,0,0.1);
    }

    /* ─── Groups & Categories (Matches vdr.html Monochrome Condensed Folder UI) ─── */
    .crm-folder-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px 10px;
      width: 100%;
      padding: 2px 0 16px;
    }

    .crm-folder-card {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 9px 6px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s ease;
    }

    .crm-folder-card:hover {
      background: #EDEDE9;
    }

    .crm-folder-card-menu-wrap {
      position: absolute;
      top: 3px;
      right: 3px;
      opacity: 0;
      transition: opacity 0.1s ease;
      z-index: 20;
    }

    .crm-folder-card:hover .crm-folder-card-menu-wrap {
      opacity: 1;
    }

    .crm-dot-menu-btn {
      background: transparent;
      border: none;
      color: #8A8A88;
      cursor: pointer;
      padding: 3px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s ease;
    }

    .crm-dot-menu-btn:hover {
      background: rgba(0, 0, 0, 0.08);
      color: #1A1A18;
    }

    .crm-context-menu {
      position: absolute;
      top: 100%;
      right: 0;
      background: #FFFFFF;
      border: 1px solid #DFDEDE;
      border-radius: 7px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      min-width: 150px;
      z-index: 100;
      padding: 3px;
      display: none;
      flex-direction: column;
      gap: 1px;
    }

    .crm-context-menu.show, .crm-context-menu.open {
      display: flex;
    }

    .crm-menu-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 600;
      color: #1A1A18;
      background: transparent;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
      width: 100%;
      font-family: inherit;
      transition: background 0.08s;
    }

    .crm-menu-item:hover {
      background: #F0F0EE;
    }

    .crm-menu-item.danger {
      color: #DC2626;
    }

    .crm-menu-item.danger:hover {
      background: #FEF2F2;
    }

    .crm-menu-divider {
      height: 1px;
      background: #EBEBEA;
      margin: 2px 0;
    }

    .crm-folder-card-graphic {
      width: 68px;
      height: 54px;
      margin: 1px auto 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: transform 0.1s ease;
    }

    .crm-folder-card:hover .crm-folder-card-graphic {
      transform: translateY(-1.5px);
    }

    .crm-folder-big-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.05));
    }

    .crm-folder-card-meta {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      width: 100%;
      min-width: 0;
    }

    .crm-folder-card-name {
      font-size: 11.5px;
      font-weight: 700;
      color: #1A1A18;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 135px;
      line-height: 1.25;
      text-align: center;
    }

    .crm-folder-card-size {
      font-size: 10px;
      color: #8C8C88;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 135px;
    }

    .crm-add-folder-card {
      background: transparent;
      border: 1.5px dashed #D4D4CE;
      border-radius: 8px;
      padding: 10px 8px 9px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      user-select: none;
      min-height: 98px;
      transition: all 0.12s ease;
    }
    .crm-add-folder-card:hover {
      background: #FFFFFF;
      border-color: #1A1A18;
    }
    .crm-add-folder-card .add-icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #F0F0EE;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7A7A78;
      margin-bottom: 5px;
      transition: all 0.12s;
    }
    .crm-add-folder-card:hover .add-icon {
      background: #1A1A18;
      color: #FFFFFF;
    }
    .crm-add-folder-card span {
      font-size: 11px;
      font-weight: 700;
      color: #7A7A78;
    }
    .crm-add-folder-card:hover span {
      color: #1A1A18;
    }
    .view-toggle {
      display: flex; background: #F0F0EE; padding: 2px; border-radius: 6px;
      border: 1px solid #E0E0DE; gap: 1px;
    }
    .view-toggle button {
      display: flex; align-items: center; gap: 4px; padding: 3px 9px;
      border-radius: 4px; border: none; background: transparent;
      font-size: 11px; font-weight: 500; color: #7A7A78; cursor: pointer;
      font-family: Inter, sans-serif;
    }
    .view-toggle button.active {
      border: 1px solid #C8C8C6; background: #FFFFFF; font-weight: 700; color: #1A1A18;
    }
    .group-count-pill {
      font-size: 12px; font-weight: 700; color: var(--text-muted);
      background: var(--bg-muted); border: 1px solid var(--border-main);
      border-radius: 10px; padding: 1px 8px;
    }
    .group-empty {
      background: #FFFFFF; border: 1px dashed #DCDCDA; border-radius: 8px;
      padding: 44px 24px; text-align: center; color: var(--text-muted);
    }
    .group-empty div { font-size: 13px; font-weight: 800; color: #2A2A28; margin-top: 8px; }
    .group-empty p { font-size: 11.5px; color: #8C8C88; margin-top: 4px; }

    /* ─── List View Table ─── */
    .table-scroll { overflow-x: auto; }
    .company-cell { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .company-logo {
      width: 26px; height: 26px; border-radius: 5px;
      background: #1A1A18; color: #FFFFFF;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 10px; flex-shrink: 0;
    }
    .company-name {
      font-weight: 700; color: #1A1A18;
      max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .sector-pill {
      font-size: 8.5px; font-weight: 700; padding: 1.5px 6px; border-radius: 3px;
      border: 1px solid #DCDCDA; text-transform: uppercase; letter-spacing: 0.04em;
      color: #5A5A58; background: #F0F0EE; white-space: nowrap;
    }
    .stage-tag {
      font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 12px;
      background: #F0F0EE; border: 1px solid #DCDCDA; color: #2A2A28; white-space: nowrap;
    }
    .data-table.list-table {
      width: 100%; border-collapse: collapse; min-width: 720px;
    }
    .data-table.list-table thead th {
      text-align: left; font-size: 9.5px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: #8C8C88; padding: 7px 12px;
      border-bottom: 1px solid #EBEBEA; background: #FAFAFA; white-space: nowrap;
    }
    .data-table.list-table thead th.num { text-align: right; }
    .data-table.list-table tbody td {
      padding: 6px 12px; font-size: 11.5px; color: #3A3A38;
      border-bottom: 1px solid #F1F1EF; vertical-align: middle; white-space: nowrap; height: 40px;
    }
    .data-table.list-table tbody td.num { text-align: right; }
    .data-table.list-table tbody tr { cursor: pointer; }
    .data-table.list-table tbody tr:hover td { background: #FAFAFA; }
    .data-table.list-table tbody tr:last-child td { border-bottom: none; }

    /* ─── Startup-Style Card View (matches startups-pool.html) ─── */
    .startup-card {
      background: #FFFFFF;
      border: 1px solid #DFDEDE;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.13s, box-shadow 0.13s, transform 0.1s;
      overflow: hidden;
    }
    .startup-card:hover {
      border-color: #B0B0AE;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
      transform: translateY(-1px);
    }
    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px 11px;
      border-bottom: 1px solid #F0F0EE;
    }
    .card-logo {
      width: 36px;
      height: 36px;
      border-radius: 7px;
      background: #F0F0EE;
      color: #3A3A38;
      border: 1px solid #E0E0DE;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12.5px;
      flex-shrink: 0;
      letter-spacing: -0.02em;
    }
    .card-title-block { flex: 1; min-width: 0; }
    .card-company-name {
      font-size: 14px;
      font-weight: 800;
      color: #1A1A18;
      letter-spacing: -0.02em;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .card-badge {
      font-size: 9.5px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.02em;
    }
    .badge-stage {
      background: #EAEAE8;
      color: #2A2A28;
      border: 1px solid #D0D0CE;
    }
    .badge-sector {
      background: #F4F4F2;
      color: #5A5A58;
      border: 1px solid #E4E4E2;
    }
    .status-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .status-New        { background: #F0F0EE; color: #3A3A38; border: 1px solid #DCDCDA; }
    .status-Reviewed   { background: #EAEAE8; color: #2A2A28; border: 1px solid #D0D0CE; }
    .status-Shortlisted{ background: #1A1A18; color: #FFFFFF; border: 1px solid #1A1A18; }
    .status-In-Pipeline{ background: #2E2E2C; color: #FFFFFF; border: 1px solid #2E2E2C; }
    .status-Passed     { background: #F5F5F3; color: #8C8C88; border: 1px solid #E0E0DE; }
    .card-pitch {
      padding: 10px 16px;
      font-size: 12px;
      color: #5A5A58;
      line-height: 1.5;
      border-bottom: 1px solid #F0F0EE;
    }
    .card-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid #F0F0EE;
    }
    .metric-cell {
      padding: 9px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      border-right: 1px solid #F0F0EE;
    }
    .metric-cell:last-child { border-right: none; }
    .metric-lbl {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #A8A8A4;
    }
    .metric-val {
      font-size: 12.5px;
      font-weight: 800;
      color: #1A1A18;
      letter-spacing: -0.01em;
    }
    .card-footer {
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FAFAFA;
    }
    .card-footer-date {
      font-size: 10.5px;
      color: #9A9A96;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-view-detail {
      font-size: 11px;
      font-weight: 700;
      color: #1A1A18;
      background: #F0F0EE;
      border: 1px solid #D4D4D2;
      border-radius: 5px;
      padding: 4px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.12s, border-color 0.12s;
    }
    .btn-view-detail:hover {
      background: #1A1A18;
      color: #FFFFFF;
      border-color: #1A1A18;
    }
    .pool-table { width: 100%; border-collapse: collapse; min-width: 720px; }
    .pool-table th {
      text-align: left;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #8C8C88;
      padding: 9px 14px;
      border-bottom: 1px solid #EBEBEA;
      background: #FAFAFA;
    }
    .pool-table th.num { text-align: right; }
    .pool-table td {
      padding: 10px 14px;
      font-size: 12px;
      color: #3A3A38;
      border-bottom: 1px solid #F3F3F1;
      vertical-align: middle;
    }
    .pool-table td.num { text-align: right; font-weight: 700; }
    .pool-table tr:hover td { background: #FAFAFA; }
    .pool-table tr:last-child td { border-bottom: none; }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="appHeaderSlot"></div>
    <div class="main-workspace" style="display:flex; flex-direction:row;">
      <div id="tinySidebarSlot"></div>
      <div id="mainSidebarSlot"></div>

      <main class="content-scrollable" style="padding:0; display:flex; flex-direction:column; background:#F8F8F6; overflow:hidden;">

        <!-- CRM ROOT (Groups Overview / Group Detail Workspace) -->
        <div id="dealCrmRoot" style="flex:1; overflow-y:auto;">
          <!-- Rendered by JS -->
        </div>

      </main>
    </div>
  </div>

  <div id="modalSlot"></div>

          </div>
          <div class="table-footer">
            <span>Showing <strong>${visible.length}</strong> of <strong>${deals.length}</strong> startups in ${g.name}</span>
            <span style="color:#8C8C88;">Click a row to open the startup record</span>
          </div>
        </div>
      `;
    }

    function toggleGroupMenu(e, id) {
      e.stopPropagation();
      const menu = document.getElementById('groupMenu_' + id);
      const isAlreadyOpen = menu && (menu.classList.contains('open') || menu.classList.contains('show'));
      closeGroupMenus();
      if (menu && !isAlreadyOpen) {
        menu.classList.add('open');
        menu.classList.add('show');
      }
    }

    function closeGroupMenus() {
      document.querySelectorAll('.group-menu.open, .crm-context-menu.open, .crm-context-menu.show').forEach(m => {
        m.classList.remove('open');
        m.classList.remove('show');
      });
    }

    // ──────────────────────────────────────────────────────────────────────────
    // GROUP MODALS (Create / Edit / Delete)
    // ──────────────────────────────────────────────────────────────────────────
    function openCreateGroupModal() {
      const slot = document.getElementById('modalSlot');
      if (!slot) return;
      slot.innerHTML = `
        <div class="edit-col-modal-backdrop" onclick="if(event.target===this) closeEditStageModal()">
          <div class="edit-col-modal">
            <h3 style="font-size:15px; font-weight:800; color:var(--text-dark); margin-bottom:14px;">Create Group</h3>
            <p style="font-size:11.5px; color:var(--text-muted); margin-bottom:14px;">Name your group and describe what this pipeline focuses on.</p>
            <div style="display:flex; flex-direction:column; gap:10px;">
              <div>
                <label class="form-label">Group Name</label>
                <input id="newGroupName" class="form-input" placeholder="e.g. Enterprise SaaS" />
              </div>
              <div>
                <label class="form-label">Description</label>
                <textarea id="newGroupDesc" class="form-input" style="min-height:56px;" placeholder="What does this group focus on?"></textarea>
              </div>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px;">
              <button class="btn btn-outline" onclick="closeEditStageModal()">Cancel</button>
              <button class="btn btn-primary" onclick="createGroup()">
                <i data-lucide="folder-plus" class="lucide-sm"></i> Create Group
              </button>
            </div>
          </div>
        </div>
      `;
      if (typeof lucide !== 'undefined') lucide.createIcons();
      setTimeout(() => document.getElementById('newGroupName')?.focus(), 60);
    }

    function createGroup() {
      const name = document.getElementById('newGroupName')?.value?.trim();
      if (!name) { alert('Please enter a group name.'); return; }
      const desc = document.getElementById('newGroupDesc')?.value?.trim() || 'No description provided.';
      GROUPS.push({ id: 'g' + Date.now(), name, desc, updated: 'Updated just now', dealIds: [] });
      closeEditStageModal();
      renderCRM();
    }

    function openEditGroupModal(id) {
      const g = GROUPS.find(x => x.id === id);
      if (!g) return;
      const slot = document.getElementById('modalSlot');
      if (!slot) return;
      slot.innerHTML = `
        <div class="edit-col-modal-backdrop" onclick="if(event.target===this) closeEditStageModal()">
          <div class="edit-col-modal">
            <h3 style="font-size:15px; font-weight:800; color:var(--text-dark); margin-bottom:14px;">Edit Group</h3>
            <div style="display:flex; flex-direction:column; gap:10px;">
              <div>
                <label class="form-label">Group Name</label>
                <input id="editGroupName" class="form-input" value="${g.name}" />
              </div>
              <div>
                <label class="form-label">Description</label>
                <textarea id="editGroupDesc" class="form-input" style="min-height:56px;">${g.desc}</textarea>
              </div>
            </div>
            <div style="display:flex; justify-content:space-between; margin-top:16px; gap:8px;">
              <button class="btn btn-outline" style="color:#DC2626; border-color:#FECACA;" onclick="promptDeleteGroup('${g.id}')">
                <i data-lucide="trash-2" class="lucide-sm"></i> Delete Group
              </button>
              <div style="display:flex; gap:8px;">
                <button class="btn btn-outline" onclick="closeEditStageModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveGroupEdit('${g.id}')">Save Changes</button>
              </div>
            </div>
          </div>
        </div>
      `;
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function saveGroupEdit(id) {
      const g = GROUPS.find(x => x.id === id);
      if (!g) return;
      const name = document.getElementById('editGroupName')?.value?.trim();
      if (!name) { alert('Please enter a group name.'); return; }
      g.name = name;
      g.desc = document.getElementById('editGroupDesc')?.value?.trim() || g.desc;
      g.updated = 'Updated just now';
      closeEditStageModal();
      renderCRM();
    }

    function promptDeleteGroup(id) {
      const g = GROUPS.find(x => x.id === id);
      if (!g) return;
      const slot = document.getElementById('modalSlot');
      if (!slot) return;
      slot.innerHTML = `
        <div class="edit-col-modal-backdrop" onclick="if(event.target===this) closeEditStageModal()">
          <div class="edit-col-modal">
            <h3 style="font-size:15px; font-weight:800; color:var(--text-dark); margin-bottom:8px;">Delete Group</h3>
            <p style="font-size:11.5px; color:var(--text-muted); line-height:1.5;">
              Permanently delete <strong>${g.name}</strong>? Deals inside this group will not be deleted — they simply leave the group.
            </p>
            <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px;">
              <button class="btn btn-outline" onclick="closeEditStageModal()">Cancel</button>
              <button class="btn btn-outline" style="color:#DC2626; border-color:#FECACA;" onclick="confirmDeleteGroup('${g.id}')">Yes, Delete</button>
            </div>
          </div>
        </div>
      `;
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function confirmDeleteGroup(id) {
      GROUPS = GROUPS.filter(x => x.id !== id);
      if (currentGroup && currentGroup.id === id) currentGroup = null;
      closeEditStageModal();
      renderCRM();
    }

    function renderDealCard(d, stageColor) {
      return `
        <div class="deal-card" onclick="navigateToDealDetail('${d.id}')" draggable="true"
             ondragstart="onDragStart(event,'${d.id}')"
             ondragover="onDragOver(event)"
             ondrop="onDrop(event,'${d.stage}')">
          <div class="deal-card-inner">
            <!-- TOP ROW -->
            <div class="deal-card-top">
              <div class="deal-card-logo">${d.avatar}</div>
              <div style="flex:1; min-width:0;">
                <div class="deal-card-name">${d.name}</div>
                <div class="deal-card-badges">
                  <span class="deal-badge deal-badge-stage">${d.stageBadge}</span>
                  <span class="deal-badge deal-badge-sector">${d.sector}</span>
                </div>
              </div>
            </div>

            <!-- METRICS -->
            <div class="deal-card-metrics">
              <div class="deal-metric-item">
                <div class="deal-metric-lbl">Ask</div>
                <div class="deal-metric-val">${d.ask}</div>
              </div>
              <div class="deal-metric-item">
                <div class="deal-metric-lbl">ARR</div>
                <div class="deal-metric-val">${d.arr}</div>
              </div>
            </div>
          </div>

          <!-- FOOTER -->
          <div class="deal-card-footer">
            <div class="deal-assignee">
              <div class="deal-avatar-sm">${d.assignee}</div>
              <span>${d.date}</span>
            </div>
            <div style="display:flex; gap:2px;">
              <button onclick="event.stopPropagation(); moveDealStage('${d.id}', -1)" title="Move left"
                style="border:none; background:transparent; cursor:pointer; padding:2px; color:#ABABAB;">
                <i data-lucide="chevron-left" style="width:11px; height:11px;"></i>
              </button>
              <button onclick="event.stopPropagation(); moveDealStage('${d.id}', 1)" title="Move right"
                style="border:none; background:transparent; cursor:pointer; padding:2px; color:#ABABAB;">
                <i data-lucide="chevron-right" style="width:11px; height:11px;"></i>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // ──────────────────────────────────────────────────────────────────────────
    // DRAG & DROP
    // ──────────────────────────────────────────────────────────────────────────
    let dragDealId = null;

    function onDragStart(e, dealId) {
      dragDealId = dealId;
      e.dataTransfer.effectAllowed = 'move';
    }
    function onDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }
    function onDrop(e, targetStage) {
      e.preventDefault();
      if (!dragDealId) return;
      const deal = DEALS.find(d => d.id === dragDealId);
      if (deal && deal.stage !== targetStage) {
        deal.stage = targetStage;
        renderCRM();
      }
      dragDealId = null;
    }

    // Also attach drop listeners to columns after render
    function attachDropToColumns() {
      STAGES.forEach(s => {
        const col = document.getElementById('cards-' + s.id);
        if (col) {
          col.addEventListener('dragover', onDragOver);
          col.addEventListener('drop', (e) => onDrop(e, s.id));
        }
      });
    }

    // ──────────────────────────────────────────────────────────────────────────
    // MOVE DEAL LEFT / RIGHT
    // ──────────────────────────────────────────────────────────────────────────
    function moveDealStage(dealId, dir) {
      const deal = DEALS.find(d => d.id === dealId);
      if (!deal) return;
      const idx = STAGES.findIndex(s => s.id === deal.stage);
      const newIdx = idx + dir;
      if (newIdx < 0 || newIdx >= STAGES.length) return;
      deal.stage = STAGES[newIdx].id;
      renderCRM();
    }

    // ──────────────────────────────────────────────────────────────────────────
    // NAVIGATE TO DEAL DETAIL
    // ──────────────────────────────────────────────────────────────────────────
    function navigateToDealDetail(dealId) {
      const deal = DEALS.find(d => d.id === dealId);
      if (deal && deal.detailId) {
        window.location.href = `./startup-detail.html?id=${deal.detailId}`;
      } else if (deal) {
        alert(`Deal: ${deal.name}\nStage: ${STAGES.find(s => s.id === deal.stage)?.label}\nAsk: ${deal.ask} · ARR: ${deal.arr}`);
      }
    }

    // ──────────────────────────────────────────────────────────────────────────
    // FILTER DEALS
    // ──────────────────────────────────────────────────────────────────────────
    function filterDeals() {
      if (currentGroup) renderCRM();
    }

    // ──────────────────────────────────────────────────────────────────────────
    // CLOSE LOCAL MODAL
    // ──────────────────────────────────────────────────────────────────────────
    function closeEditStageModal() {
      const slot = document.getElementById('modalSlot');
      if (slot) slot.innerHTML = '';
    }

    // ──────────────────────────────────────────────────────────────────────────
    // INIT
    // ──────────────────────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      renderCRM();
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.group-menu-wrap') && !e.target.closest('.crm-folder-card-menu-wrap')) closeGroupMenus();
      });
    });
  </script>
</body>
</html>
